document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html lang=\"en\" data-theme=\"dark\"><head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, viewport-fit=cover\">\n<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">\n<meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black-translucent\">\n<meta name=\"apple-mobile-web-app-title\" content=\"Citruz Portfolio\">\n<title>Citruz Portfolio<\u002Ftitle>\n<script src=\"097a8b69-7389-432b-b2f6-75d01c588a46\"><\u002Fscript>\n<style>/* ═══════════════ Apple-style design tokens ═══════════════ */\n:root{\n  /* Brand & accent */\n  --primary:#d44c2b;          /* Burnt Orange-Red */\n  --primary-focus:#e05530;\n  --primary-on-dark:#d44c2b;  /* Same in dark */\n\n  /* Surfaces */\n  --canvas:#ffffff;\n  --canvas-parchment:#f5f5f7;\n  --surface-pearl:#fafafc;\n  --tile-1:#181b24;\n  --tile-2:#1c1f2b;\n  --tile-3:#141720;\n  --tile-card:#1e2230;\n  --black:#0d0f14;\n\n  /* Text */\n  --ink:#1d1d1f;\n  --ink-muted-80:#333333;\n  --ink-muted-48:#7a7a7a;\n  --on-dark:#f0ece6;\n  --on-dark-muted:#9a9488;\n\n  /* Hairlines */\n  --divider-soft:rgba(0,0,0,0.04);\n  --hairline:#e0e0e0;\n  --hairline-dark:rgba(255,255,255,0.10);\n\n  /* States */\n  --green:#1d7f3d;\n  --red:#bf2d2d;\n  --green-bg:rgba(29,127,61,0.10);\n  --red-bg:rgba(191,45,45,0.10);\n\n  /* Shadow — the ONE shadow */\n  --product-shadow: 3px 5px 30px 0 rgba(0,0,0,0.22);\n\n  --safe-top:env(safe-area-inset-top,0px);\n  --safe-bot:env(safe-area-inset-bottom,0px);\n\n  /* Surface-aware aliases (light by default) */\n  --bg:var(--canvas-parchment);\n  --surface:var(--canvas);\n  --section-band:#e8e8ea;\n  --text:var(--ink);\n  --text-muted:var(--ink-muted-80);\n  --text-dim:var(--ink-muted-48);\n  --border:var(--hairline);\n  --border-soft:var(--divider-soft);\n}\n\n[data-theme=\"dark\"]{\n  --bg:var(--tile-1);\n  --surface:var(--tile-2);\n  --text:#f0ece6;\n  --text-muted:#b8b0a6;\n  --text-dim:#7a7060;\n  --border:rgba(212,76,43,0.18);\n  --border-soft:rgba(212,76,43,0.08);\n  --primary:#d44c2b;\n  --green:#30d158;\n  --red:#ff6961;\n  --green-bg:rgba(48,209,88,0.14);\n  --red-bg:rgba(255,105,97,0.14);\n  --hairline-dark:rgba(212,76,43,0.15);\n  --section-band:#141720;\n}\n\n*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}\n\nhtml,body{\n  height:100%;\n  background:var(--bg);\n  color:var(--text);\n  font-family:'SF Pro Text','SF Pro Display',system-ui,-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;\n  font-size:17px;\n  line-height:1.47;\n  letter-spacing:-0.374px;\n  overflow-x:hidden;\n  -webkit-font-smoothing:antialiased;\n}\n\nbutton,input{font-family:inherit}\n\n/* ═══════════════ Type scale (Apple) ═══════════════ */\n.t-hero{font-size:56px;font-weight:600;line-height:1.07;letter-spacing:-0.28px}\n.t-display-lg{font-size:40px;font-weight:600;line-height:1.10;letter-spacing:-0.28px}\n.t-display-md{font-size:34px;font-weight:600;line-height:1.18;letter-spacing:-0.374px}\n.t-lead{font-size:21px;font-weight:400;line-height:1.19;letter-spacing:0.011em;color:var(--text-muted)}\n.t-tagline{font-size:21px;font-weight:600;line-height:1.19;letter-spacing:0.011em}\n.t-body{font-size:17px;font-weight:400;line-height:1.47;letter-spacing:-0.022em}\n.t-body-strong{font-size:17px;font-weight:600;line-height:1.24;letter-spacing:-0.022em}\n.t-caption{font-size:14px;font-weight:400;line-height:1.43;letter-spacing:-0.016em}\n.t-caption-strong{font-size:14px;font-weight:600;line-height:1.29;letter-spacing:-0.016em}\n.t-fine{font-size:12px;font-weight:400;line-height:1.33;letter-spacing:-0.01em}\n\n/* ═══════════════ Lock screen (parchment, Apple-quiet) ═══════════════ */\n#lockscreen{\n  position:fixed;inset:0;z-index:9999;\n  background:#181b24;\n  display:flex;flex-direction:column;align-items:center;justify-content:center;\n  padding:40px 24px calc(var(--safe-bot) + 40px);\n  color:#f0ece6;\n}\n.lock-mark{\n  width:36px;height:36px;border-radius:50%;\n  background:#d44c2b;\n  display:flex;align-items:center;justify-content:center;\n  margin-bottom:24px;\n}\n.lock-mark::before{content:\"\";display:block;width:14px;height:11px;border:2px solid #f0ece6;border-bottom:none;border-radius:7px 7px 0 0;margin-bottom:-1px}\n.lock-mark::after{content:\"\";display:block;width:18px;height:14px;background:#f0ece6;border-radius:3px;margin-top:0}\n.lock-title{font-size:34px;font-weight:600;line-height:1.10;letter-spacing:-0.374px;margin-bottom:6px;color:#f0ece6}\n.lock-sub{font-size:17px;font-weight:400;color:#9a9488;margin-bottom:8px;letter-spacing:-0.022em;text-align:center;max-width:360px}\n.lock-error{font-size:14px;color:#ff453a;margin-top:18px;height:20px;letter-spacing:-0.016em;text-align:center}\n\n/* ── Passphrase lock screen ── */\n.lock-pane{display:flex;flex-direction:column;align-items:center;width:min(360px,86vw)}\n/* The [hidden] attribute must win over the .lock-pane display rule */\n.lock-pane[hidden]{display:none}\n.lock-form{display:flex;flex-direction:column;gap:12px;width:100%;margin-top:24px}\n\n/* Username chip — read-only, surfaces the \"account\" iCloud Keychain saves against */\n.pp-user-display{\n  font-size:13px;color:#9a9488;letter-spacing:-0.01em;\n  background:rgba(255,255,255,0.04);\n  border:1px solid rgba(212,76,43,0.12);\n  border-radius:10px;padding:9px 14px;\n  text-align:center;cursor:default;\n  -webkit-appearance:none;appearance:none;font-family:inherit;\n  outline:none;\n}\n\n.pp-input{\n  padding:16px 18px;border-radius:14px;\n  border:1px solid rgba(212,76,43,0.22);\n  background:#1c1f2b;color:#f0ece6;\n  font-size:16px;letter-spacing:0;outline:none;\n  font-family:inherit;\n  transition:border-color 0.15s, box-shadow 0.15s;\n  -webkit-appearance:none;appearance:none;\n}\n.pp-input.mono{font-family:'SF Mono',ui-monospace,Menlo,Consolas,monospace;letter-spacing:2px;text-transform:uppercase;text-align:center}\n.pp-input::placeholder{color:#7a7060}\n.pp-input:focus{border-color:#d44c2b;box-shadow:0 0 0 3px rgba(212,76,43,0.18)}\n\n.pp-submit{\n  margin-top:4px;\n  padding:14px 18px;border-radius:9999px;\n  background:#d44c2b;color:#fff;border:none;\n  font-size:16px;font-weight:500;letter-spacing:-0.016em;\n  cursor:pointer;\n  transition:transform 0.18s cubic-bezier(0.32,0.72,0,1), background 0.18s ease, box-shadow 0.18s ease;\n}\n.pp-submit:hover:not(:disabled){background:#b53d1d;transform:translateY(-1px);box-shadow:0 4px 12px rgba(212,76,43,0.28)}\n.pp-submit:active:not(:disabled){transform:translateY(0) scale(0.97);box-shadow:0 1px 3px rgba(212,76,43,0.20)}\n.pp-submit:disabled{opacity:0.6;cursor:default}\n.pp-submit.ghost{\n  background:transparent;color:#d44c2b;\n  border:1px solid rgba(212,76,43,0.45);\n}\n.pp-submit.ghost:hover:not(:disabled){\n  background:rgba(212,76,43,0.10);color:#f0ece6;\n  border-color:#d44c2b;\n}\n\n.pp-strength-track{\n  height:4px;background:rgba(255,255,255,0.10);\n  border-radius:9999px;overflow:hidden;margin-top:2px;\n}\n.pp-strength-fill{\n  display:block;height:100%;width:0%;\n  background:#ff453a;border-radius:9999px;\n  transition:width 0.2s ease, background 0.2s ease;\n}\n.pp-strength-label{\n  font-size:12px;color:#7a7060;letter-spacing:-0.01em;\n  margin-top:-4px;min-height:16px;\n}\n\n/* Recovery code reveal */\n.recovery-code-box{\n  margin-top:24px;width:100%;\n  background:#1c1f2b;\n  border:1px dashed rgba(212,76,43,0.45);\n  border-radius:14px;\n  padding:22px 16px;\n  font-family:'SF Mono',ui-monospace,Menlo,Consolas,monospace;\n  font-size:22px;letter-spacing:3px;color:#f0ece6;\n  text-align:center;word-break:break-all;\n  user-select:all;-webkit-user-select:all;\n}\n\n/* Subtle text-link buttons (e.g. \"Forgot passphrase?\", \"Reset app\", \"Back\") */\n.pp-link{\n  margin-top:18px;background:none;border:none;\n  color:#9a9488;font-size:13px;letter-spacing:-0.01em;\n  cursor:pointer;text-decoration:underline;text-underline-offset:3px;\n  font-family:inherit;padding:6px 8px;\n}\n.pp-link:hover{color:#d44c2b}\n.pp-link-danger{color:#7a7060}\n.pp-link-danger:hover{color:#ff453a}\n\n/* ═══════════════ App shell ═══════════════ */\n.app{min-height:100vh;padding-top:calc(var(--safe-top) + 52px);padding-bottom:calc(var(--safe-bot) + 96px)}\n.app-hidden{display:none}\n\n/* ═══════════════ Global nav (true black, slim) ═══════════════ */\n.global-nav{\n  position:fixed;top:0;left:0;right:0;z-index:101;\n  background:var(--black);\n  height:calc(var(--safe-top) + 44px);\n  padding:0 22px;padding-top:var(--safe-top);\n  display:flex;align-items:center;justify-content:space-between;\n  color:rgba(255,255,255,0.92);\n}\n.global-nav .gn-brand{font-size:12px;font-weight:400;letter-spacing:-0.12px;color:rgba(255,255,255,0.92)}\n.global-nav .gn-actions{display:flex;align-items:center;gap:8px}\n.gn-btn{\n  background:transparent;border:none;color:rgba(255,255,255,0.92);\n  width:32px;height:32px;border-radius:50%;\n  display:flex;align-items:center;justify-content:center;\n  cursor:pointer;transition:background 0.15s, transform 0.15s;\n}\n.gn-btn:hover{background:rgba(255,255,255,0.10)}\n.gn-btn:active{transform:scale(0.95)}\n.gn-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.5}\n\n/* ═══════════════ Sub-nav (frosted parchment) ═══════════════ */\n.sub-nav{\n  position:fixed;top:0;left:0;right:0;z-index:100;\n  padding-top:var(--safe-top);\n  background:rgba(245,245,247,0.88);\n  backdrop-filter:saturate(180%) blur(20px);\n  -webkit-backdrop-filter:saturate(180%) blur(20px);\n  border-bottom:1px solid rgba(0,0,0,0.08);\n  padding-left:20px;padding-right:20px;padding-bottom:0;\n  display:flex;flex-direction:row;align-items:center;\n  height:calc(var(--safe-top) + 52px);align-items:center;\n  color:var(--ink);\n}\n.sn-right{\n  display:flex;align-items:center;justify-content:flex-end;gap:14px;\n  margin-left:auto;flex-wrap:nowrap;height:100%;\n}\n/* Land toggle inside the sub-nav must sit vertically centred —\n   strip the 18px top margin from its standalone style */\n.sub-nav .land-toggle{margin:0}\n.sn-divider{width:1px;height:16px;background:var(--border);flex-shrink:0}\n.sub-nav-row1{\n  display:flex;align-items:center;justify-content:space-between;\n  height:44px;\n}\n.sub-nav-row2{\n  display:flex;align-items:center;justify-content:flex-start;gap:20px;\n  height:36px;\n  border-top:0.5px solid rgba(0,0,0,0.06);\n  width:100%;\n}\n[data-theme=\"dark\"] .sub-nav{\n  background:rgba(24,27,36,0.92);\n  border-bottom:1px solid rgba(212,76,43,0.20);\n  color:var(--on-dark);\n}\n.sn-title{font-size:17px;font-weight:700;letter-spacing:-0.3px;margin-right:16px;flex-shrink:0}\n.sn-left{display:flex;align-items:center;gap:16px;min-width:0;flex:1}\n.sn-controls{display:flex;align-items:center;gap:16px;flex-wrap:nowrap}\n[data-theme=\"dark\"] .land-toggle .cs-label{color:var(--text-dim)}\n[data-theme=\"dark\"] .land-toggle .lt-amt{color:var(--on-dark)}\n.sn-actions{display:flex;align-items:center;gap:14px;margin-left:auto}\n.sb-rates{display:flex;align-items:center;gap:14px;flex-wrap:wrap;min-width:0}\n.sb-rates .rate-inline{font-size:12px}\n.sb-rates .rate-inline input{width:62px;font-size:12px;font-weight:600;color:var(--text);background:transparent;border:none;border-bottom:1px solid var(--border);outline:none;-moz-appearance:textfield}\n.rate-inline input::-webkit-inner-spin-button,.rate-inline input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}\n.sb-rates .rate-inline .ri-l{font-size:12px}\n.sn-link{\n  background:transparent;border:none;cursor:pointer;\n  font-size:14px;font-weight:400;letter-spacing:-0.016em;\n  color:inherit;display:inline-flex;align-items:center;gap:6px;\n  transition:opacity 0.15s, transform 0.15s;\n}\n.sn-link:hover{opacity:0.7}\n.sn-link:active{transform:scale(0.95)}\n.sn-link svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.6}\n\n/* ═══════════════ Buttons ═══════════════ */\n.btn-pill{\n  display:inline-flex;align-items:center;justify-content:center;gap:6px;\n  background:var(--primary);color:#fff;\n  border:1px solid var(--primary);\n  border-radius:9999px;\n  padding:7px 16px;\n  font-size:14px;font-weight:400;letter-spacing:-0.016em;\n  line-height:1.29;\n  cursor:pointer;text-decoration:none;\n  transition:transform 0.18s cubic-bezier(0.32,0.72,0,1), background 0.18s ease, box-shadow 0.18s ease;\n  white-space:nowrap;\n}\n/* Primary pill — darker burnt-orange on hover + subtle lift + orange-tinted shadow */\n.btn-pill:hover{\n  background:#b53d1d;\n  transform:translateY(-1px);\n  box-shadow:0 4px 12px rgba(212,76,43,0.28);\n}\n.btn-pill:active{transform:translateY(0) scale(0.97);box-shadow:0 1px 3px rgba(212,76,43,0.20)}\n.btn-pill:focus-visible{outline:2px solid var(--primary-focus);outline-offset:2px}\n.btn-pill.ghost{\n  background:transparent;color:var(--primary);\n  border:1px solid var(--primary);\n}\n/* Ghost pill — warm orange wash on hover, same micro-lift */\n.btn-pill.ghost:hover{\n  background:rgba(212,76,43,0.10);\n  transform:translateY(-1px);\n  box-shadow:0 4px 10px rgba(212,76,43,0.14);\n}\n.btn-pill.lg{font-size:17px;padding:11px 22px;font-weight:400;line-height:1.24}\n\n.btn-utility{\n  display:inline-flex;align-items:center;justify-content:center;gap:6px;\n  background:var(--ink);color:#fff;border:none;border-radius:8px;\n  padding:8px 15px;\n  font-size:14px;font-weight:400;letter-spacing:-0.016em;\n  cursor:pointer;transition:transform 0.15s ease;\n}\n.btn-utility:active{transform:scale(0.95)}\n\n.btn-pearl{\n  display:inline-flex;align-items:center;gap:6px;\n  background:var(--surface-pearl);color:var(--ink-muted-80);\n  border:1px solid var(--divider-soft);\n  border-radius:11px;padding:8px 14px;\n  font-size:14px;cursor:pointer;\n  transition:transform 0.15s ease;\n}\n.btn-pearl:active{transform:scale(0.95)}\n\n.btn-icon-circular{\n  width:28px;height:28px;border-radius:50%;\n  background:rgba(210,210,215,0.64);\n  border:none;color:var(--ink);\n  display:flex;align-items:center;justify-content:center;\n  cursor:pointer;transition:transform 0.15s;\n}\n.btn-icon-circular:active{transform:scale(0.95)}\n\n.text-link{color:var(--primary);text-decoration:none;cursor:pointer;letter-spacing:-0.016em;font-size:14px}\n.text-link:hover{text-decoration:underline}\n\n/* ═══════════════ Hero tile (parchment) ═══════════════ */\n.tile{\n  padding:80px 22px;\n  background:var(--canvas);\n}\n.tile.parchment{background:var(--canvas-parchment)}\n.tile.dark{background:var(--tile-1);color:var(--on-dark)}\n.tile.dark-2{background:var(--tile-2);color:var(--on-dark)}\n.tile.dark-3{background:var(--tile-3);color:var(--on-dark)}\n/* Light mode overrides — dark tiles become light parchment */\nhtml:not([data-theme=\"dark\"]) .tile.dark{background:var(--canvas-parchment);color:var(--ink)}\nhtml:not([data-theme=\"dark\"]) #proj-tile .hero-total{color:var(--ink) !important}\nhtml:not([data-theme=\"dark\"]) #proj-tile .hero-eyebrow,\nhtml:not([data-theme=\"dark\"]) #proj-tile .hero-tagline{color:var(--ink-muted-48) !important}\nhtml:not([data-theme=\"dark\"]) #proj-tile .text-link{color:var(--primary) !important}\nhtml:not([data-theme=\"dark\"]) .tile.dark-2{background:var(--canvas);color:var(--ink)}\nhtml:not([data-theme=\"dark\"]) .tile.dark-3{background:var(--canvas-parchment);color:var(--ink)}\nhtml:not([data-theme=\"dark\"]) .tile.dark .t-caption,\nhtml:not([data-theme=\"dark\"]) .tile.dark .t-fine,\nhtml:not([data-theme=\"dark\"]) .tile.dark .t-body,\nhtml:not([data-theme=\"dark\"]) .tile.dark-2 .t-caption,\nhtml:not([data-theme=\"dark\"]) .tile.dark-2 .t-fine{color:var(--ink-muted-80)}\nhtml:not([data-theme=\"dark\"]) .tile.dark .on-dark-muted,\nhtml:not([data-theme=\"dark\"]) .tile.dark-2 .on-dark-muted{color:var(--ink-muted-48)}\n.tile-narrow{max-width:980px;margin:0 auto;text-align:center}\n.tile-wide{max-width:1440px;margin:0 auto}\n\n.hero-tile{\n  padding:48px 22px 56px;\n  background:var(--canvas-parchment);\n  text-align:center;\n}\n[data-theme=\"dark\"] .hero-tile{background:var(--tile-1)}\n\n.hero-eyebrow{\n  font-size:14px;font-weight:400;letter-spacing:-0.016em;\n  color:var(--ink-muted-48);\n  margin-bottom:14px;\n  text-transform:none;\n}\n[data-theme=\"dark\"] .hero-eyebrow{color:#86868b}\n\n.hero-total{\n  font-size:64px;font-weight:600;line-height:1.07;letter-spacing:-0.5px;\n  color:var(--ink);\n  margin-bottom:8px;\n}\n[data-theme=\"dark\"] .hero-total{color:var(--on-dark)}\n.hero-total .sym{font-size:40px;font-weight:500;color:var(--text-dim);margin-right:6px;letter-spacing:-0.28px}\n\n.hero-tagline{\n  font-size:21px;font-weight:400;letter-spacing:0.011em;\n  color:var(--ink-muted-80);\n  margin-bottom:18px;\n}\n[data-theme=\"dark\"] .hero-tagline{color:#bdbdc0}\n\n.hero-change-row{\n  display:flex;align-items:center;justify-content:center;gap:10px;\n  margin-bottom:6px;flex-wrap:wrap;\n}\n.change-pill{\n  display:inline-flex;align-items:center;gap:5px;\n  padding:4px 12px;border-radius:9999px;\n  font-size:14px;font-weight:600;letter-spacing:-0.016em;\n}\n.change-pill.up{background:var(--green-bg);color:var(--green)}\n.change-pill.dn{background:var(--red-bg);color:var(--red)}\n.change-label{font-size:14px;color:var(--text-dim);letter-spacing:-0.016em}\n.last-updated{font-size:12px;color:var(--text-dim);margin-top:10px;letter-spacing:-0.01em}\n\n/* ═══════════════ Hero meta row (compressed: pill · updated) ═══════════════ */\n.hero-meta-row{\n  display:flex;align-items:center;justify-content:center;gap:10px;\n  margin-top:14px;flex-wrap:wrap;\n}\n.hero-meta-row .meta-dot{color:var(--text-dim);font-size:14px}\n.hero-meta-row .meta-text{font-size:13px;color:var(--text-dim);letter-spacing:-0.016em}\n\n/* ═══════════════ Controls strip (above hero, no separators) ═══════════════ */\n.controls-strip{\n  background:var(--canvas-parchment);\n  border-bottom:1px solid var(--hairline);\n}\n[data-theme=\"dark\"] .controls-strip{\n  background:var(--tile-1);\n  border-bottom-color:var(--hairline-dark);\n}\n.cs-inner{\n  max-width:1440px;margin:0 auto;\n  display:flex;align-items:center;justify-content:space-between;\n  gap:24px;flex-wrap:wrap;\n  padding:14px 28px;\n}\n.cs-left{display:flex;align-items:center;gap:32px;flex-wrap:wrap}\n.cs-right{display:flex;align-items:center;gap:20px;flex-wrap:wrap}\n.cs-group{display:flex;align-items:center;gap:10px}\n.cs-label{font-size:12px;color:var(--text-dim);letter-spacing:-0.01em;font-weight:400}\n\n/* plain text toggle (no rounded background) */\n.seg-text{display:inline-flex;align-items:center;gap:8px}\n.segt{\n  background:transparent;border:none;cursor:pointer;\n  font:inherit;font-size:14px;font-weight:400;letter-spacing:-0.016em;\n  color:var(--text-dim);padding:0;\n}\n.segt.on{color:var(--primary);font-weight:700}\n.segt-sep{color:var(--text-dim);font-size:14px}\n\n/* inline rate (no chip background) */\n.rate-inline{display:inline-flex;align-items:center;gap:6px;font-size:13px;letter-spacing:-0.016em}\n.rate-inline .ri-l{color:var(--text-muted);white-space:nowrap;font-size:12px}\n.rate-inline input{\n  width:62px;font-size:13px;font-weight:600;\n  padding:2px 4px;border:none;background:transparent;\n  color:var(--text);text-align:right;outline:none;\n  letter-spacing:-0.016em;border-bottom:1px solid transparent;\n}\n.rate-inline input:hover,.rate-inline input:focus{border-bottom-color:var(--hairline)}\n[data-theme=\"dark\"] .rate-inline input:hover,[data-theme=\"dark\"] .rate-inline input:focus{border-bottom-color:var(--hairline-dark)}\n\n/* tighten land toggle inside controls strip */\n.controls-strip .land-toggle{background:transparent;padding:0;display:inline-flex;align-items:center;gap:6px;cursor:pointer;border:none}\n.controls-strip .land-toggle .lt-amt{font-size:14px;color:var(--text);font-weight:600;letter-spacing:-0.016em}\n\n@media (max-width: 833px){\n  .sn-controls{display:none}\n  .sb-rates{display:flex !important;gap:10px}\n}\n\n.hero-cta-row{\n  display:flex;align-items:center;justify-content:center;gap:12px;\n ank-row:nth-child(11){animation-delay:0.44s}\n@keyframes snapPillIn{from{opacity:0;transform:scale(0.85)}to{opacity:1;transform:scale(1)}}\n.snap-pill{animation:snapPillIn 0.35s cubic-bezier(0.32,0.72,0,1) 0.15s backwards}\n@keyframes snapTotalIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}\n.snap-total{animation:snapTotalIn 0.45s cubic-bezier(0.32,0.72,0,1) backwards}\n.snap-sub{animation:snapTotalIn 0.45s cubic-bezier(0.32,0.72,0,1) 0.05s backwards}\n\n/* Day pill micro pulse */\n@keyframes dayPulse{0%{transform:scale(1)}40%{transform:scale(1.08)}100%{transform:scale(1)}}\n.change-pill.pulse{animation:dayPulse 0.55s cubic-bezier(0.32,0.72,0,1)}\n\n/* Refresh icon spin */\n@keyframes spin360{to{transform:rotate(360deg)}}\n.sn-link.spinning svg{animation:spin360 0.8s linear infinite;transform-origin:center}\n\n/* Hero total fade on currency switch */\n@keyframes heroTotalSwap{0%{opacity:0.4;transform:translateY(-3px)}100%{opacity:1;transform:translateY(0)}}\n.hero-total.swap{animation:heroTotalSwap 0.35s cubic-bezier(0.32,0.72,0,1)}\n\n/* Segmented text — underline glide */\n.segt{position:relative;transition:color 0.2s}\n.segt::after{content:\"\";position:absolute;left:0;right:0;bottom:-4px;height:2px;background:var(--primary);border-radius:2px;transform:scaleX(0);transform-origin:center;transition:transform 0.25s cubic-bezier(0.32,0.72,0,1)}\n.segt.on::after{transform:scaleX(1)}\n\n/* Button pill — softer press */\n.btn-pill{transition:transform 0.15s cubic-bezier(0.32,0.72,0,1), background 0.15s ease, box-shadow 0.2s}\n.btn-pill:active{transform:scale(0.96)}\n\n/* Drawer entrance — title fade */\n@keyframes drawerTitleIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}\n.drawer.open .drawer-header{animation:drawerTitleIn 0.4s cubic-bezier(0.32,0.72,0,1) 0.08s backwards}\n\n/* Toggle haptic ripple */\n.land-toggle.on .lt-switch::after{box-shadow:0 1px 3px rgba(52,199,89,0.35),0 0 0 4px rgba(52,199,89,0.0);animation:switchPop 0.3s cubic-bezier(0.32,0.72,0,1)}\n@keyframes switchPop{0%{box-shadow:0 1px 3px rgba(52,199,89,0.35),0 0 0 0 rgba(52,199,89,0.25)}70%{box-shadow:0 1px 3px rgba(52,199,89,0.35),0 0 0 8px rgba(52,199,89,0)}100%{box-shadow:0 1px 3px rgba(52,199,89,0.35),0 0 0 0 rgba(52,199,89,0)}}\n\n@media (prefers-reduced-motion: reduce){\n  *,*::before,*::after{animation-duration:0.01ms!important;animation-iteration-count:1!important;transition-duration:0.01ms!important}\n}\n.snap-rank-pct{font-size:12px;color:var(--text-dim);letter-spacing:-0.01em;flex:0 0 44px;text-align:right;font-variant-numeric:tabular-nums}\n\n.drawer-section-title{\n  font-size:21px;font-weight:600;letter-spacing:0.011em;\n  color:var(--text);margin:28px 0 14px;\n}\n\n/* Edit fields */\n.edit-field{\n  display:flex;align-items:center;justify-content:space-between;gap:14px;\n  padding:14px 0;border-bottom:1px solid var(--border-soft);\n}\n.edit-field:last-child{border-bottom:none}\n.ef-label{font-size:17px;color:var(--text-muted);letter-spacing:-0.022em;flex:1}\n.ef-input{\n  width:140px;font-size:17px;font-weight:600;\n  padding:8px 14px;border-radius:11px;\n  border:1px solid var(--hairline);\n  background:var(--surface-pearl);\n  color:var(--text);text-align:right;outline:none;\n  letter-spacing:-0.022em;\n}\n[data-theme=\"dark\"] .ef-input{background:var(--tile-3);border-color:var(--hairline-dark)}\n.ef-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(212,76,43,0.18)}\n\n.fund-row{padding:18px 0;border-bottom:1px solid var(--border-soft)}\n.fund-row:last-child{border-bottom:none}\n.fund-row .ef-name{font-size:17px;font-weight:600;letter-spacing:-0.022em;margin-bottom:10px}\n\n/* ═══════════════ Floating sticky bar ═══════════════ */\n.sticky-bar{\n  position:fixed;bottom:0;left:0;right:0;\n  background:rgba(245,245,247,0.92);\n  backdrop-filter:saturate(180%) blur(20px);\n  -webkit-backdrop-filter:saturate(180%) blur(20px);\n  border-top:1px solid rgba(0,0,0,0.08);\n  padding:10px 20px calc(var(--safe-bot) + 10px);\n  display:none;flex-direction:column;gap:8px;\n  z-index:100;color:var(--ink);\n  min-height:60px;\n}\n[data-theme=\"dark\"] .sticky-bar{\n  background:rgba(24,27,36,0.92);\n  border-top-color:rgba(212,76,43,0.15);\n  color:var(--on-dark);\n}\n[data-theme=\"dark\"] .sb-rates .rate-inline input{color:var(--on-dark)}\n[data-theme=\"dark\"] .sb-rates .ri-l{color:var(--text-dim)}\n.sticky-bar.show{display:flex;flex-direction:column}\n.sb-status{display:flex;align-items:center;gap:8px;min-width:0;flex:1}\n.sb-dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0}\n.sb-dot.stale{background:#f59e0b}\n.sb-msg{font-size:14px;letter-spacing:-0.016em;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n.sb-saved{font-size:12px;color:var(--text-dim);letter-spacing:-0.01em;flex-shrink:0}\n\n/* Sync chip in the sticky bar — small pill, click to open the sync drawer */\n.sync-chip{\n  display:inline-flex;align-items:center;gap:5px;\n  padding:4px 10px;border-radius:9999px;\n  font-size:12px;letter-spacing:-0.016em;font-weight:500;\n  background:rgba(255,255,255,0.06);\n  border:1px solid rgba(255,255,255,0.10);\n  color:var(--text-muted);\n  cursor:pointer;font-family:inherit;\n  transition:background 0.15s, border-color 0.15s, color 0.15s, transform 0.15s;\n}\n.sync-chip:hover{background:rgba(212,76,43,0.10);border-color:rgba(212,76,43,0.40);color:var(--text)}\n.sync-chip:active{transform:scale(0.96)}\n.sync-chip svg{flex-shrink:0}\n.sync-chip.off    {color:var(--text-dim)}\n.sync-chip.ok     {color:#30d158;border-color:rgba(48,209,88,0.30);background:rgba(48,209,88,0.08)}\n.sync-chip.pending{color:#ffcc00;border-color:rgba(255,204,0,0.30);background:rgba(255,204,0,0.08)}\n.sync-chip.pending svg{animation:syncSpin 1.2s linear infinite;transform-origin:center}\n.sync-chip.err    {color:#ff453a;border-color:rgba(255,69,58,0.35);background:rgba(255,69,58,0.10)}\n@keyframes syncSpin{to{transform:rotate(360deg)}}\n\n/* ═══════════════ Footer ═══════════════ */\n.footer-tile{\n  background:var(--canvas-parchment);\n  padding:48px 22px;\n  margin-top:56px;\n  text-align:center;\n}\n[data-theme=\"dark\"] .footer-tile{background:var(--tile-3)}\n.footer-tile p{font-size:12px;color:var(--text-dim);line-height:2.0;letter-spacing:-0.01em}\n\n/* ═══════════════ Responsive ═══════════════ */\n@media (max-width: 833px){\n  .hero-total{font-size:48px}\n  .hero-total .sym{font-size:28px}\n  .section-title{font-size:28px}\n  .drawer-title{font-size:28px}\n  .asset-grid{grid-template-columns:1fr 1fr;gap:12px}\n  .asset-card{padding:18px;min-height:140px}\n  .ac-val{font-size:22px}\n  .alloc-name{width:130px;font-size:14px}\n  .alloc-pct{font-size:14px;width:46px}\n  .alloc-val{width:70px;font-size:12px}\n  .tile,.hero-tile{padding-left:18px;padding-right:18px}\n}\n@media (max-width: 480px){\n  .hero-total{font-size:40px}\n  .hero-total .sym{font-size:22px}\n  .section-title{font-size:24px}\n  .drawer-title{font-size:24px}\n  .asset-grid{grid-template-columns:1fr 1fr;gap:10px}\n  .asset-card{padding:16px;min-height:130px;border-radius:14px}\n  .ac-val{font-size:20px}\n  .alloc-name{width:auto;flex:1}\n  .alloc-bar-wrap{display:none}\n  .global-nav{padding:0 16px;padding-top:var(--safe-top)}\n  /* Preserve safe-area-inset-top so iOS status bar (clock/battery/signal) doesn't overlap the sub-nav */\n  .sub-nav{padding:var(--safe-top) 16px 0}\n  /* Let the sn-right horizontally scroll so Edit + Refresh stay reachable on iPhone width */\n  .sn-right{overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;flex-shrink:1;gap:10px;padding-right:4px}\n  .sn-right::-webkit-scrollbar{display:none}\n  /* Tighter Land toggle so the row breathes */\n  .land-toggle{padding:6px 10px 6px 12px;gap:6px}\n  .land-toggle .cs-label{font-size:12px}\n  .land-toggle .lt-amt{font-size:11px}\n  .sn-actions{gap:10px}\n  .sn-link span.label{display:none}\n  .chart-card{padding:16px;border-radius:14px}\n  .alloc-card{padding:18px;border-radius:14px}\n  .drawer{padding:20px 20px calc(var(--safe-bot) + 24px)}\n  .ef-input{width:120px}\n}\n\n/* ═══════════════ Flag badge ═══════════════ */\n.flag-badge{\n  font-size:16px;line-height:1;\n  width:26px;height:26px;\n  border-radius:50%;\n  background:var(--section-band);\n  display:flex;align-items:center;justify-content:center;\n  flex-shrink:0;\n}\n\n/* ═══════════════ Table sort + zebra ═══════════════ */\n.sort-th{cursor:pointer;user-select:none;white-space:nowrap}\n.sort-th:hover{color:var(--text)}\n.sort-arrow{font-size:10px;margin-left:3px;opacity:0.4}\n.sort-th.sort-asc .sort-arrow::after{content:'↑';opacity:1;color:var(--primary)}\n.sort-th.sort-desc .sort-arrow::after{content:'↓';opacity:1;color:var(--primary)}\n.sort-th .sort-arrow::after{content:'↕'}\n.zebra tr:nth-child(even) td{background:var(--section-band)}\n.zebra tr:hover td{background:rgba(212,76,43,0.06)}\n\n/* ═══════════════ Flag badges ═══════════════ */\n.flag-circle{\n  display:inline-flex;align-items:center;justify-content:center;\n  width:18px;height:18px;border-radius:50%;\n  font-size:11px;flex-shrink:0;\n  border:1px solid var(--border);background:var(--bg3);\n}\n.flag-sm{width:14px;height:14px;font-size:9px}\n.ac-flag{margin-bottom:6px}\n\n/* ═══════════════ Scroll animations ═══════════════ */\n.anim-fade-up {\n  opacity: 0;\n  transform: translateY(36px);\n  transition: opacity 0.55s cubic-bezier(0.22,1,0.36,1),\n              transform 0.55s cubic-bezier(0.22,1,0.36,1);\n  will-change: opacity, transform;\n}\n.anim-fade-up.in-view {\n  opacity: 1;\n  transform: translateY(0);\n}\n/* Stagger delays for grid children */\n.anim-fade-up[data-delay=\"1\"]{ transition-delay: 0.06s }\n.anim-fade-up[data-delay=\"2\"]{ transition-delay: 0.12s }\n.anim-fade-up[data-delay=\"3\"]{ transition-delay: 0.18s }\n.anim-fade-up[data-delay=\"4\"]{ transition-delay: 0.24s }\n.anim-fade-up[data-delay=\"5\"]{ transition-delay: 0.30s }\n.anim-fade-up[data-delay=\"6\"]{ transition-delay: 0.36s }\n.anim-fade-up[data-delay=\"7\"]{ transition-delay: 0.42s }\n.anim-fade-up[data-delay=\"8\"]{ transition-delay: 0.48s }\n/* Respect reduced motion */\n@media (prefers-reduced-motion: reduce) {\n  .anim-fade-up {\n    opacity: 1;\n    transform: none;\n    transition: none;\n  }\n}\n\n/* ═══════════════ Airport scramble ═══════════════ */\n.hero-total{position:relative}\n#total-val{display:inline-block;letter-spacing:-0.04em}\n.scramble-char{\n  display:inline-block;\n  transition:none;\n  min-width:0.58em;\n  text-align:center;\n}\n\n/* ═══════════════ Asset card icons ═══════════════ */\n.ac-icon-circle{\n  width:36px;height:36px;border-radius:50%;\n  background:var(--section-band);\n  display:flex;align-items:center;justify-content:center;\n  font-size:20px;margin-bottom:8px;\n}\n/* ═══════════════ Spending & Budget ═══════════════ */\n.spend-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:8px}\n.spend-stat{background:var(--surface-pearl);border:1px solid var(--hairline);border-radius:14px;padding:16px}\n[data-theme=\"dark\"] .spend-stat{background:var(--tile-2);border-color:var(--hairline-dark)}\n.spend-stat .ss-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-dim);margin-bottom:6px}\n.spend-stat .ss-val{font-size:24px;font-weight:600;color:var(--text);letter-spacing:-0.5px}\n.spend-stat .ss-sub{font-size:12px;color:var(--text-dim);margin-top:3px}\n.spend-cat{margin:13px 0}\n.spend-cat-top{display:flex;justify-content:space-between;gap:12px;font-size:14px;margin-bottom:6px}\n.spend-cat-name{color:var(--text);font-weight:500}\n.spend-cat-val{color:var(--text-dim);white-space:nowrap}\n.spend-cat-track{height:8px;background:var(--hairline);border-radius:5px;overflow:hidden}\n[data-theme=\"dark\"] .spend-cat-track{background:var(--hairline-dark)}\n.spend-cat-fill{height:100%;border-radius:5px;transition:width .5s cubic-bezier(.2,.7,.2,1)}\n.spend-bills{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}\n.spend-bill{display:flex;justify-content:space-between;gap:10px;background:var(--surface-pearl);border:1px solid var(--hairline);border-radius:11px;padding:11px 13px;font-size:13px}\n[data-theme=\"dark\"] .spend-bill{background:var(--tile-2);border-color:var(--hairline-dark)}\n.spend-bill .sb-k{color:var(--text-dim)}\n.spend-bill .sb-v{color:var(--text);font-weight:600;white-space:nowrap}\n@media (max-width:680px){.spend-stats{grid-template-columns:1fr}}\n\n/* Monthly spend trend mini-chart */\n.spend-trend{position:relative;height:172px}\n.spend-trend-inner{position:absolute;left:0;right:0;top:0;bottom:22px;display:flex;align-items:flex-end;gap:6px}\n.spend-trend-budget{position:absolute;left:0;right:0;border-top:1.5px dashed var(--text-dim);opacity:.55;pointer-events:none;z-index:1}\n.stb-col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative}\n.stb-bar{width:100%;max-width:28px;border-radius:5px 5px 0 0;min-height:3px;transition:height .5s cubic-bezier(.2,.7,.2,1)}\n.stb-lbl{position:absolute;bottom:-18px;font-size:9px;color:var(--text-dim);white-space:nowrap}\n\n/* ═══════════════ Smart sections ═══════════════ */\n.smart-section{padding:48px 22px 48px;background:var(--section-band);width:100%}\n.smart-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}\n.smart-card{\n  background:var(--surface);border-radius:16px;\n  border:0.5px solid var(--border);padding:20px;\n  cursor:pointer;transition:border-color 0.2s;\n}\n.smart-card:active{border-color:var(--primary)}\n.sc-eyebrow{font-size:11px;font-weight:600;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:8px}\n.sc-title{font-size:22px;font-weight:600;color:var(--text);letter-spacing:-0.5px;margin-bottom:4px}\n.sc-sub{font-size:13px;color:var(--text-muted);margin-bottom:12px}\n.sc-meta{font-size:12px;color:var(--text-dim)}\n.sc-badge{\n  display:inline-flex;align-items:center;gap:5px;\n  padding:3px 10px;border-radius:9999px;font-size:12px;font-weight:600;\n  margin-bottom:8px;\n}\n.sc-badge.up{background:var(--green-bg);color:var(--green)}\n.sc-badge.dn{background:var(--red-bg);color:var(--red)}\n.sc-badge.neutral{background:var(--border-soft);color:var(--text-muted)}\n.sc-progress{height:5px;background:var(--border);border-radius:9999px;overflow:hidden;margin:10px 0 6px}\n.sc-progress-fill{height:100%;border-radius:9999px;background:var(--primary);transition:width 0.6s ease}\n.sc-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:0.5px solid var(--border)}\n.sc-row:last-child{border-bottom:none}\n.sc-row-label{font-size:13px;color:var(--text-muted)}\n.sc-row-val{font-size:13px;font-weight:600;color:var(--text)}\n.fire-ring{\n  width:88px;height:88px;border-radius:50%;\n  border:none;position:relative;\n  display:flex;align-items:center;justify-content:center;\n  flex-shrink:0;margin-right:16px;\n}\n.fire-ring svg{position:absolute;top:0;left:0;width:88px;height:88px;transform:rotate(-90deg)}\n.fire-ring-pct{font-size:15px;font-weight:700;color:var(--text)}\n.fire-row{display:flex;align-items:center}\n.isa-bar{height:8px;border-radius:9999px;background:var(--border);overflow:hidden;margin:8px 0 4px}\n.isa-bar-fill{height:100%;border-radius:9999px;background:linear-gradient(90deg,var(--primary),#e87050)}\n.surplus-input{\n  display:flex;flex-direction:column;gap:4px;margin-bottom:10px;\n}\n.surplus-input label{font-size:11px;color:var(--text-dim);font-weight:600;text-transform:uppercase;letter-spacing:0.04em}\n.surplus-input input{\n  background:var(--section-band);border:0.5px solid var(--border);\n  border-radius:8px;padding:8px 12px;font-size:15px;font-weight:600;\n  color:var(--text);outline:none;width:100%;\n}\n.surplus-input input:focus{border-color:var(--primary)}\n\n/* ═══════════════ Milestone Timeline (Next milestone tile) ═══════════════ */\n.milestone-tl-wrap{\n  max-width:880px; margin:36px auto 4px; padding:0 8px;\n  text-align:left; color:var(--text-muted);\n  position:relative;\n}\n.milestone-tl{\n  position:relative; height:160px; width:100%;\n  color:var(--text-dim);\n}\n.ms-tl-svg{ position:absolute; inset:0; width:100%; height:100%; overflow:visible; pointer-events:none; }\n.ms-tl-arrowhead{\n  position:absolute; right:0; top:50%; transform:translateY(-50%);\n  width:0; height:0;\n  border-top:5px solid transparent; border-bottom:5px solid transparent;\n  border-left:7px solid currentColor;\n  color:var(--text-dim);\n  pointer-events:none;\n}\n.ms-tl-node{\n  position:absolute; top:50%; transform:translate(-50%,-50%);\n  display:flex; flex-direction:column; align-items:center;\n  cursor:pointer; user-select:none;\n  transition:transform 0.18s cubic-bezier(0.32,0.72,0,1);\n}\n.ms-tl-node .ms-tl-dot{\n  width:12px; height:12px; border-radius:50%;\n  background:var(--text); border:2px solid var(--canvas);\n  box-shadow:0 0 0 2px rgba(255,255,255,0.08);\n  transition:all 0.2s cubic-bezier(0.32,0.72,0,1);\n  flex-shrink:0;\n}\n[data-theme=\"dark\"] .ms-tl-node .ms-tl-dot{ background:var(--on-dark); border-color:#1c1f2b; }\n.ms-tl-node.reached .ms-tl-dot{ background:var(--text-dim); }\n.ms-tl-node.cr.fire-uk .ms-tl-dot{ background:#5e8edb; }\n.ms-tl-node.fire.fire-uk .ms-tl-dot{ background:#5e8edb; }\n.ms-tl-node.fire.fire-in .ms-tl-dot{ background:#3aa371; }\n.ms-tl-node:hover .ms-tl-dot{ transform:scale(1.25); }\n.ms-tl-node.active .ms-tl-dot{\n  width:18px; height:18px; transform:scale(1.4);\n  background:var(--primary); box-shadow:0 0 0 6px rgba(212,76,43,0.20), 0 0 0 12px rgba(212,76,43,0.08);\n}\n\n/* Cr label (above or below the line) */\n.ms-tl-label{\n  position:absolute; left:50%; transform:translateX(-50%);\n  display:flex; flex-direction:column; align-items:center; gap:1px;\n  white-space:nowrap; pointer-events:none;\n  font-variant-numeric:tabular-nums;\n}\n.ms-tl-node.cr.above .ms-tl-label{ bottom:14px; }\n.ms-tl-node.cr.below .ms-tl-label{ top:14px; }\n.ms-tl-l1{ font-size:13px; font-weight:600; color:var(--text); letter-spacing:-0.012em; }\n.ms-tl-l2{ font-size:11px; color:var(--text-dim); letter-spacing:-0.01em; }\n[data-theme=\"dark\"] .ms-tl-l1{ color:var(--on-dark); }\n.ms-tl-node.cr.reached .ms-tl-l2{ color:#34c759; }\n.ms-tl-node.cr.active .ms-tl-l1{ color:var(--primary-on-dark); }\n\n/* FIRE markers — compact animated flame + flag badge (no text) */\n.ms-tl-fire-mark{\n  position:absolute; left:50%; transform:translateX(-50%);\n  bottom:16px;\n  width:30px; height:30px;\n  display:flex; align-items:center; justify-content:center;\n  pointer-events:none;\n}\n.ms-tl-flame{\n  font-size:21px; line-height:1;\n  transform-origin:50% 90%;\n  animation:ms-flame-flicker 1.4s ease-in-out infinite;\n  filter:drop-shadow(0 0 5px rgba(212,76,43,0.55));\n}\n/* Flag badge tucked at the flame's base */\n.ms-tl-flag{\n  position:absolute; bottom:-3px; right:-4px;\n  font-size:12px; line-height:1;\n  filter:drop-shadow(0 1px 2px rgba(0,0,0,0.5));\n}\n/* \"Reached\" halo — soft pulsing glow behind the flame */\n.ms-tl-fire-halo{\n  position:absolute; left:50%; top:54%; transform:translate(-50%,-50%);\n  width:34px; height:34px; border-radius:50%;\n  opacity:0; pointer-events:none;\n}\n.ms-tl-node.fire.reached .ms-tl-fire-halo{\n  background:radial-gradient(circle, rgba(212,160,23,0.55) 0%, rgba(212,160,23,0.18) 45%, rgba(212,160,23,0) 70%);\n  animation:ms-flame-halo 2.2s ease-in-out infinite;\n}\n.ms-tl-node.fire.reached .ms-tl-flame{\n  filter:drop-shadow(0 0 7px rgba(212,160,23,0.85));\n}\n.ms-tl-node.fire:hover .ms-tl-flame{ animation-duration:0.8s; }\n.ms-tl-node.fire.active .ms-tl-flame{ transform:scale(1.18); filter:drop-shadow(0 0 9px rgba(232,112,80,0.95)); }\n\n@keyframes ms-flame-flicker{\n  0%,100%{ transform:scale(1,1) rotate(-1.5deg); opacity:0.92; }\n  25%    { transform:scale(1.07,1.13) rotate(1.5deg); opacity:1; }\n  50%    { transform:scale(0.95,1.05) rotate(-1deg); opacity:0.95; }\n  72%    { transform:scale(1.05,1.09) rotate(2deg); opacity:1; }\n}\n@keyframes ms-flame-halo{\n  0%,100%{ opacity:0.35; transform:translate(-50%,-50%) scale(0.85); }\n  50%    { opacity:0.8;  transform:translate(-50%,-50%) scale(1.15); }\n}\n@media (prefers-reduced-motion: reduce){\n  .ms-tl-flame{ animation:none; }\n  .ms-tl-node.fire.reached .ms-tl-fire-halo{ animation:none; opacity:0.5; }\n}\n\n/* Connector line from label to dot */\n.ms-tl-node::before{\n  content:\"\"; position:absolute; left:50%; width:1px; background:var(--border);\n  transform:translateX(-50%); pointer-events:none;\n}\n.ms-tl-node.cr.above::before{ bottom:6px; height:10px; }\n.ms-tl-node.cr.below::before{ top:6px; height:10px; }\n.ms-tl-node.fire::before{ bottom:6px; height:14px; }\n[data-theme=\"dark\"] .ms-tl-node::before{ background:rgba(255,255,255,0.18); }\n\n/* \"You are here\" marker */\n.ms-tl-here{\n  position:absolute; top:50%; transform:translate(-50%,-50%);\n  display:flex; flex-direction:column; align-items:center; gap:0;\n  pointer-events:none;\n}\n.ms-tl-here-dot{\n  width:14px; height:14px; border-radius:50%;\n  background:var(--primary); border:2px solid var(--canvas);\n  box-shadow:0 0 0 4px rgba(212,76,43,0.25), 0 0 14px rgba(212,76,43,0.5);\n  animation:msHerePulse 2.4s ease-in-out infinite;\n}\n@keyframes msHerePulse{\n  0%,100%{ box-shadow:0 0 0 4px rgba(212,76,43,0.25), 0 0 14px rgba(212,76,43,0.5); }\n  50%{ box-shadow:0 0 0 7px rgba(212,76,43,0.10), 0 0 18px rgba(212,76,43,0.6); }\n}\n.ms-tl-here-label{\n  position:absolute; top:22px; font-size:11px; font-weight:600;\n  color:var(--primary-on-dark); letter-spacing:-0.01em;\n  white-space:nowrap;\n}\n\n/* Legend */\n.ms-tl-legend{\n  display:flex; gap:18px; justify-content:center; flex-wrap:wrap;\n  margin-top:12px; padding-top:8px;\n  font-size:11px; color:var(--text-dim); letter-spacing:-0.01em;\n}\n.ms-tl-legend span{ display:inline-flex; align-items:center; gap:6px; }\n.ms-tl-legend-dot{ width:8px; height:8px; border-radius:50%; background:var(--text); }\n[data-theme=\"dark\"] .ms-tl-legend-dot{ background:var(--on-dark); }\n.ms-tl-legend-dot.fire-uk{ background:#5e8edb; }\n.ms-tl-legend-dot.fire-in{ background:#3aa371; }\n.ms-tl-legend-dot.here{ background:var(--primary); }\n\n/* Detail panel (appears below timeline when a node is tapped) */\n.ms-tl-detail{\n  margin-top:16px; padding:16px 18px;\n  background:rgba(255,255,255,0.04);\n  border:1px solid var(--border);\n  border-radius:14px;\n  text-align:left;\n  animation:msDetailIn 0.22s cubic-bezier(0.32,0.72,0,1);\n}\n[data-theme=\"dark\"] .ms-tl-detail{ background:rgba(255,255,255,0.04); border-color:rgba(255,255,255,0.10); }\n@keyframes msDetailIn{ from{ opacity:0; transform:translateY(-4px); } to{ opacity:1; transform:none; } }\n.ms-tl-d-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:14px; }\n.ms-tl-d-kind{ font-size:11px; letter-spacing:0.05em; text-transform:uppercase; color:var(--text-dim); font-weight:500; }\n.ms-tl-d-title{ font-size:22px; font-weight:600; color:var(--text); letter-spacing:-0.018em; }\n[data-theme=\"dark\"] .ms-tl-d-title{ color:var(--on-dark); }\n.ms-tl-d-close{\n  background:transparent; border:1px solid var(--border); color:var(--text-dim);\n  width:30px; height:30px; border-radius:50%;\n  cursor:pointer; display:inline-flex; align-items:center; justify-content:center;\n  font-size:13px; line-height:1; transition:all 0.15s;\n}\n.ms-tl-d-close:hover{ color:var(--text); border-color:var(--text-dim); }\n[data-theme=\"dark\"] .ms-tl-d-close{ border-color:rgba(255,255,255,0.18); }\n.ms-tl-d-grid{\n  display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px 24px;\n}\n.ms-tl-d-l{ font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.05em; font-weight:500; margin-bottom:3px; }\n.ms-tl-d-v{ font-size:18px; font-weight:600; color:var(--text); letter-spacing:-0.014em; font-variant-numeric:tabular-nums; }\n[data-theme=\"dark\"] .ms-tl-d-v{ color:var(--on-dark); }\n.ms-tl-d-foot{ margin-top:12px; font-size:12px; color:var(--text-dim); line-height:1.5; }\n\n@media (max-width: 640px){\n  .milestone-tl{ height:130px; }\n  .ms-tl-node.cr.below .ms-tl-label{ top:auto; bottom:14px; }\n  .ms-tl-node.cr.below::before{ top:auto; bottom:6px; }\n  .ms-tl-l1{ font-size:11px; }\n  .ms-tl-l2{ font-size:10px; }\n  .ms-tl-fire-mark{ width:26px; height:26px; bottom:14px; }\n  .ms-tl-flame{ font-size:18px; }\n  .ms-tl-flag{ font-size:11px; }\n  .ms-tl-d-grid{ grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px 16px; }\n  .ms-tl-d-v{ font-size:15px; }\n  .ms-tl-d-title{ font-size:18px; }\n  .ms-tl-here-label{ font-size:10px; top:20px; }\n  .milestone-tl-wrap{ margin-top:24px; padding:0 4px; }\n  .ms-tl-legend{ gap:10px 12px; font-size:10px; }\n}\n<\u002Fstyle>\n\n<!-- Bundler thumbnail (shown briefly when opening the bundled offline file) -->\n\n<\u002Fhead>\n<body>\n\n<!-- ═══════════════ LOCK ═══════════════ -->\n<div id=\"lockscreen\">\n  <div class=\"lock-mark\"><\u002Fdiv>\n\n  <!-- Setup pane: shown on first run when no passphrase is configured -->\n  <div class=\"lock-pane\" id=\"setup-pane\" hidden=\"\">\n    <div class=\"lock-title\">Set passphrase<\u002Fdiv>\n    <div class=\"lock-sub\">\n      At least 12 characters. Mix letters, digits and symbols.<br>\n      Forget it and your data is gone — there's no reset.\n    <\u002Fdiv>\n    <form class=\"lock-form\" id=\"setup-form\" onsubmit=\"event.preventDefault();doSetup()\">\n      <!-- Username field: stable identifier for iCloud Keychain so it can save and autofill across devices -->\n      <input type=\"text\" id=\"setup-user\" class=\"pp-user-display\" autocomplete=\"username\" name=\"username\" value=\"portfolio\" readonly=\"\" tabindex=\"-1\">\n      <input type=\"password\" id=\"setup-pp1\" class=\"pp-input\" placeholder=\"Passphrase\" autocomplete=\"new-password\" autocapitalize=\"off\" autocorrect=\"off\" spellcheck=\"false\">\n      <div class=\"pp-strength-track\"><div class=\"pp-strength-fill\" id=\"pp-meter\"><\u002Fdiv><\u002Fdiv>\n      <div class=\"pp-strength-label\" id=\"pp-strength-label\">—<\u002Fdiv>\n      <input type=\"password\" id=\"setup-pp2\" class=\"pp-input\" placeholder=\"Confirm passphrase\" autocomplete=\"new-password\" autocapitalize=\"off\" autocorrect=\"off\" spellcheck=\"false\">\n      <button type=\"submit\" class=\"pp-submit\" id=\"setup-btn\">Create &amp; unlock<\u002Fbutton>\n    <\u002Fform>\n    <div class=\"lock-error\" id=\"setup-error\"><\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- Recovery-code reveal pane: shown ONCE, right after setup succeeds -->\n  <div class=\"lock-pane\" id=\"recovery-show-pane\" hidden=\"\">\n    <div class=\"lock-title\">Save your recovery code<\u002Fdiv>\n    <div class=\"lock-sub\">\n      If you ever forget your passphrase, this code is the only way back in.<br>\n      Save it in your password manager, on paper, or email it to yourself.\n    <\u002Fdiv>\n    <div class=\"recovery-code-box\" id=\"recovery-code-display\">—<\u002Fdiv>\n    <div class=\"lock-form\" style=\"margin-top:18px\">\n      <button type=\"button\" class=\"pp-submit ghost\" onclick=\"copyRecoveryCode()\">Copy code<\u002Fbutton>\n      <button type=\"button\" class=\"pp-submit ghost\" onclick=\"downloadRecoveryCode()\">Download as .txt<\u002Fbutton>\n      <button type=\"button\" class=\"pp-submit\" id=\"recovery-confirm-btn\" onclick=\"confirmRecoverySaved()\">I've saved it — continue<\u002Fbutton>\n    <\u002Fdiv>\n    <div class=\"lock-error\" id=\"recovery-show-error\"><\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- Unlock pane: shown on every subsequent open -->\n  <div class=\"lock-pane\" id=\"unlock-pane\" hidden=\"\">\n    <div class=\"lock-title\">Citruz Portfolio<\u002Fdiv>\n    <div class=\"lock-sub\">Enter your passphrase.<\u002Fdiv>\n    <form class=\"lock-form\" id=\"unlock-form\" onsubmit=\"event.preventDefault();doUnlock()\">\n      <input type=\"text\" id=\"unlock-user\" class=\"pp-user-display\" autocomplete=\"username\" name=\"username\" value=\"portfolio\" readonly=\"\" tabindex=\"-1\">\n      <input type=\"password\" id=\"unlock-pp\" class=\"pp-input\" placeholder=\"Passphrase\" autocomplete=\"current-password\" autocapitalize=\"off\" autocorrect=\"off\" spellcheck=\"false\">\n      <button type=\"submit\" class=\"pp-submit\" id=\"unlock-btn\">Unlock<\u002Fbutton>\n    <\u002Fform>\n    <div class=\"lock-error\" id=\"unlock-error\"><\u002Fdiv>\n    <button type=\"button\" class=\"pp-link\" onclick=\"showRecoveryUnlock()\">Forgot passphrase? Use recovery code<\u002Fbutton>\n    <button type=\"button\" class=\"pp-link pp-link-danger\" onclick=\"FinAuth.factoryReset()\">Reset app (deletes all data)<\u002Fbutton>\n  <\u002Fdiv>\n\n  <!-- Recovery unlock pane: user has the recovery code, no passphrase -->\n  <div class=\"lock-pane\" id=\"recovery-unlock-pane\" hidden=\"\">\n    <div class=\"lock-title\">Recovery code<\u002Fdiv>\n    <div class=\"lock-sub\">\n      Enter the 20-character code you saved at setup.<br>\n      Hyphens and case are ignored.\n    <\u002Fdiv>\n    <form class=\"lock-form\" onsubmit=\"event.preventDefault();doRecoveryUnlock()\">\n      <input type=\"text\" id=\"recovery-input\" class=\"pp-input mono\" placeholder=\"XXXX-XXXX-XXXX-XXXX-XXXX\" autocomplete=\"off\" autocapitalize=\"characters\" autocorrect=\"off\" spellcheck=\"false\">\n      <button type=\"submit\" class=\"pp-submit\" id=\"recovery-unlock-btn\">Recover &amp; set new passphrase<\u002Fbutton>\n    <\u002Fform>\n    <div class=\"lock-error\" id=\"recovery-unlock-error\"><\u002Fdiv>\n    <button type=\"button\" class=\"pp-link\" onclick=\"showUnlockPane()\">← Back to passphrase<\u002Fbutton>\n  <\u002Fdiv>\n\n  <!-- Set new passphrase pane: after successful recovery, force user to pick a fresh one -->\n  <div class=\"lock-pane\" id=\"rotate-pane\" hidden=\"\">\n    <div class=\"lock-title\">Set a new passphrase<\u002Fdiv>\n    <div class=\"lock-sub\">\n      Your old passphrase is replaced. A new recovery code will be generated.\n    <\u002Fdiv>\n    <form class=\"lock-form\" onsubmit=\"event.preventDefault();doRotate()\">\n      <input type=\"text\" class=\"pp-user-display\" autocomplete=\"username\" name=\"username\" value=\"portfolio\" readonly=\"\" tabindex=\"-1\">\n      <input type=\"password\" id=\"rotate-pp1\" class=\"pp-input\" placeholder=\"New passphrase\" autocomplete=\"new-password\" autocapitalize=\"off\" autocorrect=\"off\" spellcheck=\"false\">\n      <div class=\"pp-strength-track\"><div class=\"pp-strength-fill\" id=\"rotate-meter\"><\u002Fdiv><\u002Fdiv>\n      <div class=\"pp-strength-label\" id=\"rotate-strength-label\">—<\u002Fdiv>\n      <input type=\"password\" id=\"rotate-pp2\" class=\"pp-input\" placeholder=\"Confirm new passphrase\" autocomplete=\"new-password\" autocapitalize=\"off\" autocorrect=\"off\" spellcheck=\"false\">\n      <button type=\"submit\" class=\"pp-submit\" id=\"rotate-btn\">Update passphrase<\u002Fbutton>\n    <\u002Fform>\n    <div class=\"lock-error\" id=\"rotate-error\"><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ═══════════════ APP ═══════════════ -->\n<div class=\"app app-hidden\" id=\"app\">\n\n\n\n  <!-- Sub nav (frosted parchment) — merged: title + currency + land + actions -->\n  <div class=\"sub-nav\">\n    <div class=\"sn-title\">Citruz Portfolio<\u002Fdiv>\n    <div class=\"sn-right\">\n      <div class=\"seg-text\" role=\"tablist\">\n        <button class=\"segt on\" id=\"seg-inr\" onclick=\"setCurrency('inr',this)\">₹ INR<\u002Fbutton>\n        <span class=\"segt-sep\">/<\u002Fspan>\n        <button class=\"segt\" id=\"seg-gbp\" onclick=\"setCurrency('gbp',this)\">£ GBP<\u002Fbutton>\n      <\u002Fdiv>\n      <button class=\"land-toggle\" id=\"land-toggle\" onclick=\"toggleLand()\" aria-pressed=\"false\">\n        <span class=\"cs-label\">Land<\u002Fspan>\n        <span class=\"lt-amt\">₹3.18Cr<\u002Fspan>\n        <span class=\"lt-switch\"><\u002Fspan>\n      <\u002Fbutton>\n      <div class=\"sn-divider\"><\u002Fdiv>\n      <button class=\"sn-link\" id=\"theme-btn\" onclick=\"toggleTheme()\" aria-label=\"Toggle theme\">\n        <svg viewBox=\"0 0 24 24\" style=\"width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.5\"><circle cx=\"12\" cy=\"12\" r=\"4\"><\u002Fcircle><path d=\"M12 2v2M12 20v2M2 12h2M20 12h2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41\"><\u002Fpath><\u002Fsvg>\n      <\u002Fbutton>\n      <button class=\"sn-link\" onclick=\"openExportMenu()\">\n        <svg viewBox=\"0 0 24 24\" style=\"width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.5\"><path d=\"M12 3v12M7 10l5 5 5-5M5 21h14\"><\u002Fpath><\u002Fsvg>\n        <span class=\"label\">Export<\u002Fspan>\n      <\u002Fbutton>\n      <button class=\"sn-link\" id=\"edit-btn\" onclick=\"toggleEdit()\">\n        <svg viewBox=\"0 0 24 24\" style=\"width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.5\"><path d=\"M16.86 3.55a2 2 0 0 1 2.83 0l.76.76a2 2 0 0 1 0 2.83L7.5 19.94 3 21l1.06-4.5L16.86 3.55z\"><\u002Fpath><\u002Fsvg>\n        <span class=\"label\">Edit<\u002Fspan>\n      <\u002Fbutton>\n      <button class=\"btn-pill\" id=\"refresh-btn\" onclick=\"doRefresh()\">Refresh<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- Edit banner -->\n  <div class=\"edit-banner\" id=\"edit-banner\">\n    <div>\n      <div class=\"edit-banner-title\">Edit mode on.<\u002Fdiv>\n      <div class=\"edit-banner-sub\">Tap any asset card to edit its values.<\u002Fdiv>\n    <\u002Fdiv>\n    <button class=\"btn-pill\" onclick=\"saveEdits()\">Save all<\u002Fbutton>\n  <\u002Fdiv>\n\n\n\n  <!-- HERO TILE (compressed: 2 bands only) -->\n  <section class=\"hero-tile\">\n    <div class=\"tile-narrow\">\n      <div class=\"hero-eyebrow\" id=\"hero-eyebrow\">Total portfolio · excl. land<\u002Fdiv>\n      <div class=\"hero-total\"><span class=\"sym\" id=\"currency-sym\">₹<\u002Fspan><span id=\"total-val\">—<\u002Fspan><\u002Fdiv>\n      <div class=\"hero-tagline\" id=\"hero-sec\">£— equivalent<\u002Fdiv>\n      <div class=\"hero-meta-row\">\n        <div class=\"change-pill\" id=\"day-pill\">—<\u002Fdiv>\n        <span class=\"meta-dot\">·<\u002Fspan>\n        <span class=\"meta-text\" id=\"last-upd\">—<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- DARK TILE — projection (alternation rhythm) -->\n  <section class=\"tile dark\" id=\"proj-tile\">\n    <div class=\"tile-narrow\" style=\"cursor:pointer\" onclick=\"openDrawer('proj')\">\n      <div class=\"hero-eyebrow\" style=\"color:var(--text-dim)\">Next milestone<\u002Fdiv>\n      <div class=\"hero-total\" id=\"proj-time-big\" style=\"color:var(--text)\">—<\u002Fdiv>\n      <div class=\"hero-tagline\" style=\"color:var(--text-muted)\" id=\"proj-sub\">— to go · 10% p.a.<\u002Fdiv>\n      <div style=\"max-width:480px;margin:24px auto 0\">\n        <div style=\"height:6px;background:var(--border-soft,rgba(0,0,0,0.08));border-radius:9999px;overflow:hidden\">\n          <div id=\"prog-fill\" style=\"height:100%;background:#d44c2b;border-radius:9999px;transition:width 0.6s ease;width:0%\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between;margin-top:10px;font-size:14px;letter-spacing:-0.016em;color:var(--text-muted)\">\n          <span id=\"prog-done\">—<\u002Fspan>\n          <span id=\"prog-todo\">— to go<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <!-- Milestone timeline (₹4Cr → ₹10Cr) -->\n      <div class=\"milestone-tl-wrap\" id=\"ms-tl-wrap\" onclick=\"event.stopPropagation()\">\n        <div class=\"milestone-tl\" id=\"ms-tl\"><\u002Fdiv>\n        <div class=\"ms-tl-detail\" id=\"ms-tl-detail\" hidden=\"\"><\u002Fdiv>\n        <div class=\"ms-tl-legend\">\n          <span><
