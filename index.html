document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html lang=\"en\" data-theme=\"dark\"><head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, viewport-fit=cover\">\n<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">\n<meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black-translucent\">\n<meta name=\"apple-mobile-web-app-title\" content=\"Citruz Portfolio\">\n<title>Citruz Portfolio<\u002Ftitle>\n<script src=\"74d914a2-cc88-4136-9a2f-4738c436db41\"><\u002Fscript>\n<style>/* ═══════════════ Apple-style design tokens ═══════════════ */\n:root{\n  /* Brand & accent */\n  --primary:#d44c2b;          /* Burnt Orange-Red */\n  --primary-focus:#e05530;\n  --primary-on-dark:#d44c2b;  /* Same in dark */\n\n  /* Surfaces */\n  --canvas:#ffffff;\n  --canvas-parchment:#f5f5f7;\n  --surface-pearl:#fafafc;\n  --tile-1:#181b24;\n  --tile-2:#1c1f2b;\n  --tile-3:#141720;\n  --tile-card:#1e2230;\n  --black:#0d0f14;\n\n  /* Text */\n  --ink:#1d1d1f;\n  --ink-muted-80:#333333;\n  --ink-muted-48:#7a7a7a;\n  --on-dark:#f0ece6;\n  --on-dark-muted:#9a9488;\n\n  /* Hairlines */\n  --divider-soft:rgba(0,0,0,0.04);\n  --hairline:#e0e0e0;\n  --hairline-dark:rgba(255,255,255,0.10);\n\n  /* States */\n  --green:#1d7f3d;\n  --red:#bf2d2d;\n  --green-bg:rgba(29,127,61,0.10);\n  --red-bg:rgba(191,45,45,0.10);\n\n  /* Shadow — the ONE shadow */\n  --product-shadow: 3px 5px 30px 0 rgba(0,0,0,0.22);\n\n  --safe-top:env(safe-area-inset-top,0px);\n  --safe-bot:env(safe-area-inset-bottom,0px);\n\n  /* Surface-aware aliases (light by default) */\n  --bg:var(--canvas-parchment);\n  --surface:var(--canvas);\n  --section-band:#e8e8ea;\n  --text:var(--ink);\n  --text-muted:var(--ink-muted-80);\n  --text-dim:var(--ink-muted-48);\n  --border:var(--hairline);\n  --border-soft:var(--divider-soft);\n}\n\n[data-theme=\"dark\"]{\n  --bg:var(--tile-1);\n  --surface:var(--tile-2);\n  --text:#f0ece6;\n  --text-muted:#b8b0a6;\n  --text-dim:#7a7060;\n  --border:rgba(212,76,43,0.18);\n  --border-soft:rgba(212,76,43,0.08);\n  --primary:#d44c2b;\n  --green:#30d158;\n  --red:#ff6961;\n  --green-bg:rgba(48,209,88,0.14);\n  --red-bg:rgba(255,105,97,0.14);\n  --hairline-dark:rgba(212,76,43,0.15);\n  --section-band:#141720;\n}\n\n*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}\n\nhtml,body{\n  height:100%;\n  background:var(--bg);\n  color:var(--text);\n  font-family:'SF Pro Text','SF Pro Display',system-ui,-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;\n  font-size:17px;\n  line-height:1.47;\n  letter-spacing:-0.374px;\n  overflow-x:hidden;\n  -webkit-font-smoothing:antialiased;\n}\n\nbutton,input{font-family:inherit}\n\n/* ═══════════════ Type scale (Apple) ═══════════════ */\n.t-hero{font-size:56px;font-weight:600;line-height:1.07;letter-spacing:-0.28px}\n.t-display-lg{font-size:40px;font-weight:600;line-height:1.10;letter-spacing:-0.28px}\n.t-display-md{font-size:34px;font-weight:600;line-height:1.18;letter-spacing:-0.374px}\n.t-lead{font-size:21px;font-weight:400;line-height:1.19;letter-spacing:0.011em;color:var(--text-muted)}\n.t-tagline{font-size:21px;font-weight:600;line-height:1.19;letter-spacing:0.011em}\n.t-body{font-size:17px;font-weight:400;line-height:1.47;letter-spacing:-0.022em}\n.t-body-strong{font-size:17px;font-weight:600;line-height:1.24;letter-spacing:-0.022em}\n.t-caption{font-size:14px;font-weight:400;line-height:1.43;letter-spacing:-0.016em}\n.t-caption-strong{font-size:14px;font-weight:600;line-height:1.29;letter-spacing:-0.016em}\n.t-fine{font-size:12px;font-weight:400;line-height:1.33;letter-spacing:-0.01em}\n\n/* ═══════════════ Lock screen (parchment, Apple-quiet) ═══════════════ */\n#lockscreen{\n  position:fixed;inset:0;z-index:9999;\n  background:#181b24;\n  display:flex;flex-direction:column;align-items:center;justify-content:center;\n  padding:40px 24px calc(var(--safe-bot) + 40px);\n  color:#f0ece6;\n}\n.lock-mark{\n  width:36px;height:36px;border-radius:50%;\n  background:#d44c2b;\n  display:flex;align-items:center;justify-content:center;\n  margin-bottom:24px;\n}\n.lock-mark::before{content:\"\";display:block;width:14px;height:11px;border:2px solid #f0ece6;border-bottom:none;border-radius:7px 7px 0 0;margin-bottom:-1px}\n.lock-mark::after{content:\"\";display:block;width:18px;height:14px;background:#f0ece6;border-radius:3px;margin-top:0}\n.lock-title{font-size:34px;font-weight:600;line-height:1.10;letter-spacing:-0.374px;margin-bottom:6px;color:#f0ece6}\n.lock-sub{font-size:17px;font-weight:400;color:#9a9488;margin-bottom:8px;letter-spacing:-0.022em;text-align:center;max-width:360px}\n.lock-error{font-size:14px;color:#ff453a;margin-top:18px;height:20px;letter-spacing:-0.016em;text-align:center}\n\n/* ── Passphrase lock screen ── */\n.lock-pane{display:flex;flex-direction:column;align-items:center;width:min(360px,86vw)}\n/* The [hidden] attribute must win over the .lock-pane display rule */\n.lock-pane[hidden]{display:none}\n.lock-form{display:flex;flex-direction:column;gap:12px;width:100%;margin-top:24px}\n\n/* Username chip — read-only, surfaces the \"account\" iCloud Keychain saves against */\n.pp-user-display{\n  font-size:13px;color:#9a9488;letter-spacing:-0.01em;\n  background:rgba(255,255,255,0.04);\n  border:1px solid rgba(212,76,43,0.12);\n  border-radius:10px;padding:9px 14px;\n  text-align:center;cursor:default;\n  -webkit-appearance:none;appearance:none;font-family:inherit;\n  outline:none;\n}\n\n.pp-input{\n  padding:16px 18px;border-radius:14px;\n  border:1px solid rgba(212,76,43,0.22);\n  background:#1c1f2b;color:#f0ece6;\n  font-size:16px;letter-spacing:0;outline:none;\n  font-family:inherit;\n  transition:border-color 0.15s, box-shadow 0.15s;\n  -webkit-appearance:none;appearance:none;\n}\n.pp-input.mono{font-family:'SF Mono',ui-monospace,Menlo,Consolas,monospace;letter-spacing:2px;text-transform:uppercase;text-align:center}\n.pp-input::placeholder{color:#7a7060}\n.pp-input:focus{border-color:#d44c2b;box-shadow:0 0 0 3px rgba(212,76,43,0.18)}\n\n.pp-submit{\n  margin-top:4px;\n  padding:14px 18px;border-radius:9999px;\n  background:#d44c2b;color:#fff;border:none;\n  font-size:16px;font-weight:500;letter-spacing:-0.016em;\n  cursor:pointer;\n  transition:transform 0.18s cubic-bezier(0.32,0.72,0,1), background 0.18s ease, box-shadow 0.18s ease;\n}\n.pp-submit:hover:not(:disabled){background:#b53d1d;transform:translateY(-1px);box-shadow:0 4px 12px rgba(212,76,43,0.28)}\n.pp-submit:active:not(:disabled){transform:translateY(0) scale(0.97);box-shadow:0 1px 3px rgba(212,76,43,0.20)}\n.pp-submit:disabled{opacity:0.6;cursor:default}\n.pp-submit.ghost{\n  background:transparent;color:#d44c2b;\n  border:1px solid rgba(212,76,43,0.45);\n}\n.pp-submit.ghost:hover:not(:disabled){\n  background:rgba(212,76,43,0.10);color:#f0ece6;\n  border-color:#d44c2b;\n}\n\n.pp-strength-track{\n  height:4px;background:rgba(255,255,255,0.10);\n  border-radius:9999px;overflow:hidden;margin-top:2px;\n}\n.pp-strength-fill{\n  display:block;height:100%;width:0%;\n  background:#ff453a;border-radius:9999px;\n  transition:width 0.2s ease, background 0.2s ease;\n}\n.pp-strength-label{\n  font-size:12px;color:#7a7060;letter-spacing:-0.01em;\n  margin-top:-4px;min-height:16px;\n}\n\n/* Recovery code reveal */\n.recovery-code-box{\n  margin-top:24px;width:100%;\n  background:#1c1f2b;\n  border:1px dashed rgba(212,76,43,0.45);\n  border-radius:14px;\n  padding:22px 16px;\n  font-family:'SF Mono',ui-monospace,Menlo,Consolas,monospace;\n  font-size:22px;letter-spacing:3px;color:#f0ece6;\n  text-align:center;word-break:break-all;\n  user-select:all;-webkit-user-select:all;\n}\n\n/* Subtle text-link buttons (e.g. \"Forgot passphrase?\", \"Reset app\", \"Back\") */\n.pp-link{\n  margin-top:18px;background:none;border:none;\n  color:#9a9488;font-size:13px;letter-spacing:-0.01em;\n  cursor:pointer;text-decoration:underline;text-underline-offset:3px;\n  font-family:inherit;padding:6px 8px;\n}\n.pp-link:hover{color:#d44c2b}\n.pp-link-danger{color:#7a7060}\n.pp-link-danger:hover{color:#ff453a}\n\n/* ═══════════════ App shell ═══════════════ */\n.app{min-height:100vh;padding-top:calc(var(--safe-top) + 52px);padding-bottom:calc(var(--safe-bot) + 96px)}\n.app-hidden{display:none}\n\n/* ═══════════════ Global nav (true black, slim) ═══════════════ */\n.global-nav{\n  position:fixed;top:0;left:0;right:0;z-index:101;\n  background:var(--black);\n  height:calc(var(--safe-top) + 44px);\n  padding:0 22px;padding-top:var(--safe-top);\n  display:flex;align-items:center;justify-content:space-between;\n  color:rgba(255,255,255,0.92);\n}\n.global-nav .gn-brand{font-size:12px;font-weight:400;letter-spacing:-0.12px;color:rgba(255,255,255,0.92)}\n.global-nav .gn-actions{display:flex;align-items:center;gap:8px}\n.gn-btn{\n  background:transparent;border:none;color:rgba(255,255,255,0.92);\n  width:32px;height:32px;border-radius:50%;\n  display:flex;align-items:center;justify-content:center;\n  cursor:pointer;transition:background 0.15s, transform 0.15s;\n}\n.gn-btn:hover{background:rgba(255,255,255,0.10)}\n.gn-btn:active{transform:scale(0.95)}\n.gn-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.5}\n\n/* ═══════════════ Sub-nav (frosted parchment) ═══════════════ */\n.sub-nav{\n  position:fixed;top:0;left:0;right:0;z-index:100;\n  padding-top:var(--safe-top);\n  background:rgba(245,245,247,0.88);\n  backdrop-filter:saturate(180%) blur(20px);\n  -webkit-backdrop-filter:saturate(180%) blur(20px);\n  border-bottom:1px solid rgba(0,0,0,0.08);\n  padding-left:20px;padding-right:20px;padding-bottom:0;\n  display:flex;flex-direction:row;align-items:center;\n  height:calc(var(--safe-top) + 52px);align-items:center;\n  color:var(--ink);\n}\n.sn-right{\n  display:flex;align-items:center;justify-content:flex-end;gap:14px;\n  margin-left:auto;flex-wrap:nowrap;height:100%;\n}\n/* Land toggle inside the sub-nav must sit vertically centred —\n   strip the 18px top margin from its standalone style */\n.sub-nav .land-toggle{margin:0}\n.sn-divider{width:1px;height:16px;background:var(--border);flex-shrink:0}\n.sub-nav-row1{\n  display:flex;align-items:center;justify-content:space-between;\n  height:44px;\n}\n.sub-nav-row2{\n  display:flex;align-items:center;justify-content:flex-start;gap:20px;\n  height:36px;\n  border-top:0.5px solid rgba(0,0,0,0.06);\n  width:100%;\n}\n[data-theme=\"dark\"] .sub-nav{\n  background:rgba(24,27,36,0.92);\n  border-bottom:1px solid rgba(212,76,43,0.20);\n  color:var(--on-dark);\n}\n.sn-title{font-size:17px;font-weight:700;letter-spacing:-0.3px;margin-right:16px;flex-shrink:0}\n.sn-left{display:flex;align-items:center;gap:16px;min-width:0;flex:1}\n.sn-controls{display:flex;align-items:center;gap:16px;flex-wrap:nowrap}\n[data-theme=\"dark\"] .land-toggle .cs-label{color:var(--text-dim)}\n[data-theme=\"dark\"] .land-toggle .lt-amt{color:var(--on-dark)}\n.sn-actions{display:flex;align-items:center;gap:14px;margin-left:auto}\n.sb-rates{display:flex;align-items:center;gap:14px;flex-wrap:wrap;min-width:0}\n.sb-rates .rate-inline{font-size:12px}\n.sb-rates .rate-inline input{width:62px;font-size:12px;font-weight:600;color:var(--text);background:transparent;border:none;border-bottom:1px solid var(--border);outline:none;-moz-appearance:textfield}\n.rate-inline input::-webkit-inner-spin-button,.rate-inline input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}\n.sb-rates .rate-inline .ri-l{font-size:12px}\n.sn-link{\n  background:transparent;border:none;cursor:pointer;\n  font-size:14px;font-weight:400;letter-spacing:-0.016em;\n  color:inherit;display:inline-flex;align-items:center;gap:6px;\n  transition:opacity 0.15s, transform 0.15s;\n}\n.sn-link:hover{opacity:0.7}\n.sn-link:active{transform:scale(0.95)}\n.sn-link svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.6}\n\n/* ═══════════════ Buttons ═══════════════ */\n.btn-pill{\n  display:inline-flex;align-items:center;justify-content:center;gap:6px;\n  background:var(--primary);color:#fff;\n  border:1px solid var(--primary);\n  border-radius:9999px;\n  padding:7px 16px;\n  font-size:14px;font-weight:400;letter-spacing:-0.016em;\n  line-height:1.29;\n  cursor:pointer;text-decoration:none;\n  transition:transform 0.18s cubic-bezier(0.32,0.72,0,1), background 0.18s ease, box-shadow 0.18s ease;\n  white-space:nowrap;\n}\n/* Primary pill — darker burnt-orange on hover + subtle lift + orange-tinted shadow */\n.btn-pill:hover{\n  background:#b53d1d;\n  transform:translateY(-1px);\n  box-shadow:0 4px 12px rgba(212,76,43,0.28);\n}\n.btn-pill:active{transform:translateY(0) scale(0.97);box-shadow:0 1px 3px rgba(212,76,43,0.20)}\n.btn-pill:focus-visible{outline:2px solid var(--primary-focus);outline-offset:2px}\n.btn-pill.ghost{\n  background:transparent;color:var(--primary);\n  border:1px solid var(--primary);\n}\n/* Ghost pill — warm orange wash on hover, same micro-lift */\n.btn-pill.ghost:hover{\n  background:rgba(212,76,43,0.10);\n  transform:translateY(-1px);\n  box-shadow:0 4px 10px rgba(212,76,43,0.14);\n}\n.btn-pill.lg{font-size:17px;padding:11px 22px;font-weight:400;line-height:1.24}\n\n.btn-utility{\n  display:inline-flex;align-items:center;justify-content:center;gap:6px;\n  background:var(--ink);color:#fff;border:none;border-radius:8px;\n  padding:8px 15px;\n  font-size:14px;font-weight:400;letter-spacing:-0.016em;\n  cursor:pointer;transition:transform 0.15s ease;\n}\n.btn-utility:active{transform:scale(0.95)}\n\n.btn-pearl{\n  display:inline-flex;align-items:center;gap:6px;\n  background:var(--surface-pearl);color:var(--ink-muted-80);\n  border:1px solid var(--divider-soft);\n  border-radius:11px;padding:8px 14px;\n  font-size:14px;cursor:pointer;\n  transition:transform 0.15s ease;\n}\n.btn-pearl:active{transform:scale(0.95)}\n\n.btn-icon-circular{\n  width:28px;height:28px;border-radius:50%;\n  background:rgba(210,210,215,0.64);\n  border:none;color:var(--ink);\n  display:flex;align-items:center;justify-content:center;\n  cursor:pointer;transition:transform 0.15s;\n}\n.btn-icon-circular:active{transform:scale(0.95)}\n\n.text-link{color:var(--primary);text-decoration:none;cursor:pointer;letter-spacing:-0.016em;font-size:14px}\n.text-link:hover{text-decoration:underline}\n\n/* ═══════════════ Hero tile (parchment) ═══════════════ */\n.tile{\n  padding:80px 22px;\n  background:var(--canvas);\n}\n.tile.parchment{background:var(--canvas-parchment)}\n.tile.dark{background:var(--tile-1);color:var(--on-dark)}\n.tile.dark-2{background:var(--tile-2);color:var(--on-dark)}\n.tile.dark-3{background:var(--tile-3);color:var(--on-dark)}\n/* Light mode overrides — dark tiles become light parchment */\nhtml:not([data-theme=\"dark\"]) .tile.dark{background:var(--canvas-parchment);color:var(--ink)}\nhtml:not([data-theme=\"dark\"]) #proj-tile .hero-total{color:var(--ink) !important}\nhtml:not([data-theme=\"dark\"]) #proj-tile .hero-eyebrow,\nhtml:not([data-theme=\"dark\"]) #proj-tile .hero-tagline{color:var(--ink-muted-48) !important}\nhtml:not([data-theme=\"dark\"]) #proj-tile .text-link{color:var(--primary) !important}\nhtml:not([data-theme=\"dark\"]) .tile.dark-2{background:var(--canvas);color:var(--ink)}\nhtml:not([data-theme=\"dark\"]) .tile.dark-3{background:var(--canvas-parchment);color:var(--ink)}\nhtml:not([data-theme=\"dark\"]) .tile.dark .t-caption,\nhtml:not([data-theme=\"dark\"]) .tile.dark .t-fine,\nhtml:not([data-theme=\"dark\"]) .tile.dark .t-body,\nhtml:not([data-theme=\"dark\"]) .tile.dark-2 .t-caption,\nhtml:not([data-theme=\"dark\"]) .tile.dark-2 .t-fine{color:var(--ink-muted-80)}\nhtml:not([data-theme=\"dark\"]) .tile.dark .on-dark-muted,\nhtml:not([data-theme=\"dark\"]) .tile.dark-2 .on-dark-muted{color:var(--ink-muted-48)}\n.tile-narrow{max-width:980px;margin:0 auto;text-align:center}\n.tile-wide{max-width:1440px;margin:0 auto}\n\n.hero-tile{\n  padding:48px 22px 56px;\n  background:var(--canvas-parchment);\n  text-align:center;\n}\n[data-theme=\"dark\"] .h 4px;color:var(--text-dim);margin-top:2px;letter-spacing:-0.016em}\n\n/* ═══════════════ Drawer (sheet) ═══════════════ */\n.drawer-overlay{\n  position:fixed;inset:0;\n  background:rgba(0,0,0,0.40);\n  backdrop-filter:saturate(180%) blur(8px);\n  -webkit-backdrop-filter:saturate(180%) blur(8px);\n  z-index:200;opacity:0;pointer-events:none;\n  transition:opacity 0.3s;\n}\n.drawer-overlay.open{opacity:1;pointer-events:all}\n.drawer{\n  position:fixed;bottom:0;left:50%;transform:translate(-50%,100%);\n  width:min(720px,100%);\n  background:var(--canvas);\n  border-radius:24px 24px 0 0;\n  border-top:1px solid var(--hairline);\n  padding:24px 28px calc(var(--safe-bot) + 32px);\n  z-index:201;\n  transition:transform 0.4s cubic-bezier(0.32,0.72,0,1);\n  max-height:88vh;overflow-y:auto;\n  color:var(--text);\n}\n[data-theme=\"dark\"] .drawer{background:var(--tile-2);border-top-color:var(--hairline-dark)}\n.drawer.open{transform:translate(-50%,0)}\n.drawer-handle{width:40px;height:5px;background:rgba(0,0,0,0.12);border-radius:9999px;margin:0 auto 22px}\n[data-theme=\"dark\"] .drawer-handle{background:rgba(255,255,255,0.20)}\n.drawer-title{font-size:34px;font-weight:600;letter-spacing:-0.374px;line-height:1.18;margin-bottom:6px}\n.drawer-subtitle{font-size:17px;color:var(--text-dim);letter-spacing:-0.022em;margin-bottom:24px}\n.drawer-close{\n  position:absolute;top:18px;right:22px;\n  width:32px;height:32px;border-radius:50%;\n  background:rgba(0,0,0,0.06);border:none;color:var(--ink);\n  font-size:14px;cursor:pointer;\n  display:flex;align-items:center;justify-content:center;\n  transition:transform 0.15s ease;\n}\n[data-theme=\"dark\"] .drawer-close{background:rgba(255,255,255,0.10);color:#fff}\n.drawer-close:active{transform:scale(0.95)}\n\n/* Tables (drawer) */\n.detail-table{width:100%;border-collapse:collapse;font-size:14px;letter-spacing:-0.016em}\n.detail-table th{\n  text-align:left;font-size:12px;font-weight:600;\n  color:var(--text-dim);padding:10px 8px;\n  border-bottom:1px solid var(--border);\n  letter-spacing:-0.01em;text-transform:none;\n}\n.detail-table th.r{text-align:right}\n.detail-table td{padding:14px 8px;border-bottom:1px solid var(--border-soft);color:var(--text);vertical-align:middle}\n.detail-table td.r{text-align:right}\n.detail-table tr:last-child td{border-bottom:none}\n.detail-table small{color:var(--text-dim);font-size:12px;letter-spacing:-0.01em}\n.tup{color:var(--green);font-weight:600}\n.tdn{color:var(--red);font-weight:600}\n\n.summary-row{\n  display:flex;justify-content:space-between;align-items:flex-start;\n  padding:14px 0;border-bottom:1px solid var(--border-soft);\n  gap:16px;\n}\n.summary-row:last-child{border-bottom:none}\n.sr-label{font-size:17px;color:var(--text-muted);letter-spacing:-0.022em}\n.sr-sub{font-size:14px;color:var(--text-dim);margin-top:2px;letter-spacing:-0.016em}\n.sr-val{font-size:17px;font-weight:600;color:var(--text);text-align:right;letter-spacing:-0.022em}\n\n/* ═══════════════ Snapshot preview (export drawer) ═══════════════ */\n.snap-hero{\n  text-align:left;padding:18px 0 22px;\n  border-bottom:1px solid var(--border-soft);margin-bottom:8px;\n}\n.snap-eyebrow{font-size:13px;color:var(--text-dim);letter-spacing:-0.016em;margin-bottom:6px}\n.snap-total{font-size:40px;font-weight:600;letter-spacing:-0.4px;color:var(--text);line-height:1.1}\n.snap-sub{font-size:15px;color:var(--text-dim);letter-spacing:-0.016em;margin-top:4px}\n.snap-pill{\n  display:inline-flex;align-items:center;gap:4px;\n  margin-top:12px;padding:4px 11px;border-radius:9999px;\n  font-size:13px;font-weight:600;letter-spacing:-0.016em;\n}\n.snap-pill.up{background:var(--green-bg);color:var(--green)}\n.snap-pill.dn{background:var(--red-bg);color:var(--red)}\n.snap-section-title{\n  font-size:17px;font-weight:600;letter-spacing:-0.022em;\n  color:var(--text);margin:24px 0 8px;\n  display:flex;align-items:baseline;gap:10px;\n}\n.snap-section-hint{font-size:12px;font-weight:400;color:var(--text-dim);letter-spacing:-0.01em}\n.snap-rank-list{display:flex;flex-direction:column;gap:0}\n.snap-rank-row{\n  display:flex;gap:14px;align-items:center;\n  padding:12px 0;border-bottom:1px solid var(--border-soft);\n}\n.snap-rank-row:last-child{border-bottom:none}\n.snap-rank{\n  flex:0 0 28px;\n  font-size:15px;font-weight:600;color:var(--text-dim);\n  letter-spacing:-0.016em;font-variant-numeric:tabular-nums;\n}\n.snap-rank-body{flex:1;min-width:0}\n.snap-rank-top{display:flex;justify-content:space-between;gap:10px;margin-bottom:6px}\n.snap-rank-label{font-size:15px;color:var(--text);letter-spacing:-0.016em}\n.snap-rank-val{font-size:15px;font-weight:600;color:var(--text);letter-spacing:-0.016em;font-variant-numeric:tabular-nums}\n.snap-rank-bottom{display:flex;align-items:center;gap:10px}\n.snap-bar{flex:1;height:6px;background:var(--border-soft);border-radius:9999px;overflow:hidden}\n[data-theme=\"dark\"] .snap-bar{background:rgba(255,255,255,0.10)}\n.snap-bar-fill{height:100%;background:var(--primary);border-radius:9999px;transition:width 0.7s cubic-bezier(0.32,0.72,0,1)}\n@keyframes snapRowIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}\n.snap-rank-row{animation:snapRowIn 0.4s cubic-bezier(0.32,0.72,0,1) backwards}\n.snap-rank-row:nth-child(1){animation-delay:0.04s}\n.snap-rank-row:nth-child(2){animation-delay:0.08s}\n.snap-rank-row:nth-child(3){animation-delay:0.12s}\n.snap-rank-row:nth-child(4){animation-delay:0.16s}\n.snap-rank-row:nth-child(5){animation-delay:0.20s}\n.snap-rank-row:nth-child(6){animation-delay:0.24s}\n.snap-rank-row:nth-child(7){animation-delay:0.28s}\n.snap-rank-row:nth-child(8){animation-delay:0.32s}\n.snap-rank-row:nth-child(9){animation-delay:0.36s}\n.snap-rank-row:nth-child(10){animation-delay:0.40s}\n.snap-rank-row:nth-child(11){animation-delay:0.44s}\n@keyframes snapPillIn{from{opacity:0;transform:scale(0.85)}to{opacity:1;transform:scale(1)}}\n.snap-pill{animation:snapPillIn 0.35s cubic-bezier(0.32,0.72,0,1) 0.15s backwards}\n@keyframes snapTotalIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}\n.snap-total{animation:snapTotalIn 0.45s cubic-bezier(0.32,0.72,0,1) backwards}\n.snap-sub{animation:snapTotalIn 0.45s cubic-bezier(0.32,0.72,0,1) 0.05s backwards}\n\n/* Day pill micro pulse */\n@keyframes dayPulse{0%{transform:scale(1)}40%{transform:scale(1.08)}100%{transform:scale(1)}}\n.change-pill.pulse{animation:dayPulse 0.55s cubic-bezier(0.32,0.72,0,1)}\n\n/* Refresh icon spin */\n@keyframes spin360{to{transform:rotate(360deg)}}\n.sn-link.spinning svg{animation:spin360 0.8s linear infinite;transform-origin:center}\n\n/* Hero total fade on currency switch */\n@keyframes heroTotalSwap{0%{opacity:0.4;transform:translateY(-3px)}100%{opacity:1;transform:translateY(0)}}\n.hero-total.swap{animation:heroTotalSwap 0.35s cubic-bezier(0.32,0.72,0,1)}\n\n/* Segmented text — underline glide */\n.segt{position:relative;transition:color 0.2s}\n.segt::after{content:\"\";position:absolute;left:0;right:0;bottom:-4px;height:2px;background:var(--primary);border-radius:2px;transform:scaleX(0);transform-origin:center;transition:transform 0.25s cubic-bezier(0.32,0.72,0,1)}\n.segt.on::after{transform:scaleX(1)}\n\n/* Button pill — softer press */\n.btn-pill{transition:transform 0.15s cubic-bezier(0.32,0.72,0,1), background 0.15s ease, box-shadow 0.2s}\n.btn-pill:active{transform:scale(0.96)}\n\n/* Drawer entrance — title fade */\n@keyframes drawerTitleIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}\n.drawer.open .drawer-header{animation:drawerTitleIn 0.4s cubic-bezier(0.32,0.72,0,1) 0.08s backwards}\n\n/* Toggle haptic ripple */\n.land-toggle.on .lt-switch::after{box-shadow:0 1px 3px rgba(52,199,89,0.35),0 0 0 4px rgba(52,199,89,0.0);animation:switchPop 0.3s cubic-bezier(0.32,0.72,0,1)}\n@keyframes switchPop{0%{box-shadow:0 1px 3px rgba(52,199,89,0.35),0 0 0 0 rgba(52,199,89,0.25)}70%{box-shadow:0 1px 3px rgba(52,199,89,0.35),0 0 0 8px rgba(52,199,89,0)}100%{box-shadow:0 1px 3px rgba(52,199,89,0.35),0 0 0 0 rgba(52,199,89,0)}}\n\n@media (prefers-reduced-motion: reduce){\n  *,*::before,*::after{animation-duration:0.01ms!important;animation-iteration-count:1!important;transition-duration:0.01ms!important}\n}\n.snap-rank-pct{font-size:12px;color:var(--text-dim);letter-spacing:-0.01em;flex:0 0 44px;text-align:right;font-variant-numeric:tabular-nums}\n\n.drawer-section-title{\n  font-size:21px;font-weight:600;letter-spacing:0.011em;\n  color:var(--text);margin:28px 0 14px;\n}\n\n/* Edit fields */\n.edit-field{\n  display:flex;align-items:center;justify-content:space-between;gap:14px;\n  padding:14px 0;border-bottom:1px solid var(--border-soft);\n}\n.edit-field:last-child{border-bottom:none}\n.ef-label{font-size:17px;color:var(--text-muted);letter-spacing:-0.022em;flex:1}\n.ef-input{\n  width:140px;font-size:17px;font-weight:600;\n  padding:8px 14px;border-radius:11px;\n  border:1px solid var(--hairline);\n  background:var(--surface-pearl);\n  color:var(--text);text-align:right;outline:none;\n  letter-spacing:-0.022em;\n}\n[data-theme=\"dark\"] .ef-input{background:var(--tile-3);border-color:var(--hairline-dark)}\n.ef-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(212,76,43,0.18)}\n\n.fund-row{padding:18px 0;border-bottom:1px solid var(--border-soft)}\n.fund-row:last-child{border-bottom:none}\n.fund-row .ef-name{font-size:17px;font-weight:600;letter-spacing:-0.022em;margin-bottom:10px}\n\n/* ═══════════════ Floating sticky bar ═══════════════ */\n.sticky-bar{\n  position:fixed;bottom:0;left:0;right:0;\n  background:rgba(245,245,247,0.92);\n  backdrop-filter:saturate(180%) blur(20px);\n  -webkit-backdrop-filter:saturate(180%) blur(20px);\n  border-top:1px solid rgba(0,0,0,0.08);\n  padding:10px 20px calc(var(--safe-bot) + 10px);\n  display:none;flex-direction:column;gap:8px;\n  z-index:100;color:var(--ink);\n  min-height:60px;\n}\n[data-theme=\"dark\"] .sticky-bar{\n  background:rgba(24,27,36,0.92);\n  border-top-color:rgba(212,76,43,0.15);\n  color:var(--on-dark);\n}\n[data-theme=\"dark\"] .sb-rates .rate-inline input{color:var(--on-dark)}\n[data-theme=\"dark\"] .sb-rates .ri-l{color:var(--text-dim)}\n.sticky-bar.show{display:flex;flex-direction:column}\n.sb-status{display:flex;align-items:center;gap:8px;min-width:0;flex:1}\n.sb-dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0}\n.sb-dot.stale{background:#f59e0b}\n.sb-msg{font-size:14px;letter-spacing:-0.016em;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n.sb-saved{font-size:12px;color:var(--text-dim);letter-spacing:-0.01em;flex-shrink:0}\n\n/* Sync chip in the sticky bar — small pill, click to open the sync drawer */\n.sync-chip{\n  display:inline-flex;align-items:center;gap:5px;\n  padding:4px 10px;border-radius:9999px;\n  font-size:12px;letter-spacing:-0.016em;font-weight:500;\n  background:rgba(255,255,255,0.06);\n  border:1px solid rgba(255,255,255,0.10);\n  color:var(--text-muted);\n  cursor:pointer;font-family:inherit;\n  transition:background 0.15s, border-color 0.15s, color 0.15s, transform 0.15s;\n}\n.sync-chip:hover{background:rgba(212,76,43,0.10);border-color:rgba(212,76,43,0.40);color:var(--text)}\n.sync-chip:active{transform:scale(0.96)}\n.sync-chip svg{flex-shrink:0}\n.sync-chip.off    {color:var(--text-dim)}\n.sync-chip.ok     {color:#30d158;border-color:rgba(48,209,88,0.30);background:rgba(48,209,88,0.08)}\n.sync-chip.pending{color:#ffcc00;border-color:rgba(255,204,0,0.30);background:rgba(255,204,0,0.08)}\n.sync-chip.pending svg{animation:syncSpin 1.2s linear infinite;transform-origin:center}\n.sync-chip.err    {color:#ff453a;border-color:rgba(255,69,58,0.35);background:rgba(255,69,58,0.10)}\n@keyframes syncSpin{to{transform:rotate(360deg)}}\n\n/* ═══════════════ Footer ═══════════════ */\n.footer-tile{\n  background:var(--canvas-parchment);\n  padding:48px 22px;\n  margin-top:56px;\n  text-align:center;\n}\n[data-theme=\"dark\"] .footer-tile{background:var(--tile-3)}\n.footer-tile p{font-size:12px;color:var(--text-dim);line-height:2.0;letter-spacing:-0.01em}\n\n/* ═══════════════ Responsive ═══════════════ */\n@media (max-width: 833px){\n  .hero-total{font-size:48px}\n  .hero-total .sym{font-size:28px}\n  .section-title{font-size:28px}\n  .drawer-title{font-size:28px}\n  .asset-grid{grid-template-columns:1fr 1fr;gap:12px}\n  .asset-card{padding:18px;min-height:140px}\n  .ac-val{font-size:22px}\n  .alloc-name{width:130px;font-size:14px}\n  .alloc-pct{font-size:14px;width:46px}\n  .alloc-val{width:70px;font-size:12px}\n  .tile,.hero-tile{padding-left:18px;padding-right:18px}\n}\n@media (max-width: 480px){\n  .hero-total{font-size:40px}\n  .hero-total .sym{font-size:22px}\n  .section-title{font-size:24px}\n  .drawer-title{font-size:24px}\n  .asset-grid{grid-template-columns:1fr 1fr;gap:10px}\n  .asset-card{padding:16px;min-height:130px;border-radius:14px}\n  .ac-val{font-size:20px}\n  .alloc-name{width:auto;flex:1}\n  .alloc-bar-wrap{display:none}\n  .global-nav{padding:0 16px;padding-top:var(--safe-top)}\n  /* Preserve safe-area-inset-top so iOS status bar (clock/battery/signal) doesn't overlap the sub-nav */\n  .sub-nav{padding:var(--safe-top) 16px 0}\n  /* Let the sn-right horizontally scroll so Edit + Refresh stay reachable on iPhone width */\n  .sn-right{overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;flex-shrink:1;gap:10px;padding-right:4px}\n  .sn-right::-webkit-scrollbar{display:none}\n  /* Tighter Land toggle so the row breathes */\n  .land-toggle{padding:6px 10px 6px 12px;gap:6px}\n  .land-toggle .cs-label{font-size:12px}\n  .land-toggle .lt-amt{font-size:11px}\n  .sn-actions{gap:10px}\n  .sn-link span.label{display:none}\n  .chart-card{padding:16px;border-radius:14px}\n  .alloc-card{padding:18px;border-radius:14px}\n  .drawer{padding:20px 20px calc(var(--safe-bot) + 24px)}\n  .ef-input{width:120px}\n}\n\n/* ═══════════════ Flag badge ═══════════════ */\n.flag-badge{\n  font-size:16px;line-height:1;\n  width:26px;height:26px;\n  border-radius:50%;\n  background:var(--section-band);\n  display:flex;align-items:center;justify-content:center;\n  flex-shrink:0;\n}\n\n/* ═══════════════ Table sort + zebra ═══════════════ */\n.sort-th{cursor:pointer;user-select:none;white-space:nowrap}\n.sort-th:hover{color:var(--text)}\n.sort-arrow{font-size:10px;margin-left:3px;opacity:0.4}\n.sort-th.sort-asc .sort-arrow::after{content:'↑';opacity:1;color:var(--primary)}\n.sort-th.sort-desc .sort-arrow::after{content:'↓';opacity:1;color:var(--primary)}\n.sort-th .sort-arrow::after{content:'↕'}\n.zebra tr:nth-child(even) td{background:var(--section-band)}\n.zebra tr:hover td{background:rgba(212,76,43,0.06)}\n\n/* ═══════════════ Flag badges ═══════════════ */\n.flag-circle{\n  display:inline-flex;align-items:center;justify-content:center;\n  width:18px;height:18px;border-radius:50%;\n  font-size:11px;flex-shrink:0;\n  border:1px solid var(--border);background:var(--bg3);\n}\n.flag-sm{width:14px;height:14px;font-size:9px}\n.ac-flag{margin-bottom:6px}\n\n/* ═══════════════ Scroll animations ═══════════════ */\n.anim-fade-up {\n  opacity: 0;\n  transform: translateY(36px);\n  transition: opacity 0.55s cubic-bezier(0.22,1,0.36,1),\n              transform 0.55s cubic-bezier(0.22,1,0.36,1);\n  will-change: opacity, transform;\n}\n.anim-fade-up.in-view {\n  opacity: 1;\n  transform: translateY(0);\n}\n/* Stagger delays for grid children */\n.anim-fade-up[data-delay=\"1\"]{ transition-delay: 0.06s }\n.anim-fade-up[data-delay=\"2\"]{ transition-delay: 0.12s }\n.anim-fade-up[data-delay=\"3\"]{ transition-delay: 0.18s }\n.anim-fade-up[data-delay=\"4\"]{ transition-delay: 0.24s }\n.anim-fade-up[data-delay=\"5\"]{ transition-delay: 0.30s }\n.anim-fade-up[data-delay=\"6\"]{ transition-delay: 0.36s }\n.anim-fade-up[data-delay=\"7\"]{ transition-delay: 0.42s }\n.anim-fade-up[data-delay=\"8\"]{ transition-delay: 0.48s }\n/* Respect reduced motion */\n@media (prefers-reduced-motion: reduce) {\n  .anim-fade-up {\n    opacity: 1;\n    transform: none;\n    transition: none;\n  }\n}\n\n/* ═══════════════ Airport scramble ═══════════════ */\n.hero-total{position:relative}\n#total-val{display:inline-block;letter-spacing:-0.04em}\n.scramble-char{\n  display:inline-block;\n  transition:none;\n  min-width:0.58em;\n  text-align:center;\n}\n\n/* ═══════════════ Asset card icons ═══════════════ */\n.ac-icon-circle{\n  width:36px;height:36px;border-radius:50%;\n  background:var(--section-band);\n  display:flex;align-items:center;justify-content:center;\n  font-size:20px;margin-bottom:8px;\n}\n/* ═══════════════ Smart sections ═══════════════ */\n.smart-section{padding:48px 22px 48px;background:var(--section-band);width:100%}\n.smart-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}\n.smart-card{\n  background:var(--surface);border-radius:16px;\n  border:0.5px solid var(--border);padding:20px;\n  cursor:pointer;transition:border-color 0.2s;\n}\n.smart-card:active{border-color:var(--primary)}\n.sc-eyebrow{font-size:11px;font-weight:600;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:8px}\n.sc-title{font-size:22px;font-weight:600;color:var(--text);letter-spacing:-0.5px;margin-bottom:4px}\n.sc-sub{font-size:13px;color:var(--text-muted);margin-bottom:12px}\n.sc-meta{font-size:12px;color:var(--text-dim)}\n.sc-badge{\n  display:inline-flex;align-items:center;gap:5px;\n  padding:3px 10px;border-radius:9999px;font-size:12px;font-weight:600;\n  margin-bottom:8px;\n}\n.sc-badge.up{background:var(--green-bg);color:var(--green)}\n.sc-badge.dn{background:var(--red-bg);color:var(--red)}\n.sc-badge.neutral{background:var(--border-soft);color:var(--text-muted)}\n.sc-progress{height:5px;background:var(--border);border-radius:9999px;overflow:hidden;margin:10px 0 6px}\n.sc-progress-fill{height:100%;border-radius:9999px;background:var(--primary);transition:width 0.6s ease}\n.sc-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:0.5px solid var(--border)}\n.sc-row:last-child{border-bottom:none}\n.sc-row-label{font-size:13px;color:var(--text-muted)}\n.sc-row-val{font-size:13px;font-weight:600;color:var(--text)}\n.fire-ring{\n  width:88px;height:88px;border-radius:50%;\n  border:none;position:relative;\n  display:flex;align-items:center;justify-content:center;\n  flex-shrink:0;margin-right:16px;\n}\n.fire-ring svg{position:absolute;top:0;left:0;width:88px;height:88px;transform:rotate(-90deg)}\n.fire-ring-pct{font-size:15px;font-weight:700;color:var(--text)}\n.fire-row{display:flex;align-items:center}\n.isa-bar{height:8px;border-radius:9999px;background:var(--border);overflow:hidden;margin:8px 0 4px}\n.isa-bar-fill{height:100%;border-radius:9999px;background:linear-gradient(90deg,var(--primary),#e87050)}\n.surplus-input{\n  display:flex;flex-direction:column;gap:4px;margin-bottom:10px;\n}\n.surplus-input label{font-size:11px;color:var(--text-dim);font-weight:600;text-transform:uppercase;letter-spacing:0.04em}\n.surplus-input input{\n  background:var(--section-band);border:0.5px solid var(--border);\n  border-radius:8px;padding:8px 12px;font-size:15px;font-weight:600;\n  color:var(--text);outline:none;width:100%;\n}\n.surplus-input input:focus{border-color:var(--primary)}\n\n/* ═══════════════ Milestone Timeline (Next milestone tile) ═══════════════ */\n.milestone-tl-wrap{\n  max-width:880px; margin:36px auto 4px; padding:0 8px;\n  text-align:left; color:var(--text-muted);\n  position:relative;\n}\n.milestone-tl{\n  position:relative; height:160px; width:100%;\n  color:var(--text-dim);\n}\n.ms-tl-svg{ position:absolute; inset:0; width:100%; height:100%; overflow:visible; pointer-events:none; }\n.ms-tl-arrowhead{\n  position:absolute; right:0; top:50%; transform:translateY(-50%);\n  width:0; height:0;\n  border-top:5px solid transparent; border-bottom:5px solid transparent;\n  border-left:7px solid currentColor;\n  color:var(--text-dim);\n  pointer-events:none;\n}\n.ms-tl-node{\n  position:absolute; top:50%; transform:translate(-50%,-50%);\n  display:flex; flex-direction:column; align-items:center;\n  cursor:pointer; user-select:none;\n  transition:transform 0.18s cubic-bezier(0.32,0.72,0,1);\n}\n.ms-tl-node .ms-tl-dot{\n  width:12px; height:12px; border-radius:50%;\n  background:var(--text); border:2px solid var(--canvas);\n  box-shadow:0 0 0 2px rgba(255,255,255,0.08);\n  transition:all 0.2s cubic-bezier(0.32,0.72,0,1);\n  flex-shrink:0;\n}\n[data-theme=\"dark\"] .ms-tl-node .ms-tl-dot{ background:var(--on-dark); border-color:#1c1f2b; }\n.ms-tl-node.reached .ms-tl-dot{ background:var(--text-dim); }\n.ms-tl-node.cr.fire-uk .ms-tl-dot{ background:#5e8edb; }\n.ms-tl-node.fire.fire-uk .ms-tl-dot{ background:#5e8edb; }\n.ms-tl-node.fire.fire-in .ms-tl-dot{ background:#3aa371; }\n.ms-tl-node:hover .ms-tl-dot{ transform:scale(1.25); }\n.ms-tl-node.active .ms-tl-dot{\n  width:18px; height:18px; transform:scale(1.4);\n  background:var(--primary); box-shadow:0 0 0 6px rgba(212,76,43,0.20), 0 0 0 12px rgba(212,76,43,0.08);\n}\n\n/* Cr label (above or below the line) */\n.ms-tl-label{\n  position:absolute; left:50%; transform:translateX(-50%);\n  display:flex; flex-direction:column; align-items:center; gap:1px;\n  white-space:nowrap; pointer-events:none;\n  font-variant-numeric:tabular-nums;\n}\n.ms-tl-node.cr.above .ms-tl-label{ bottom:14px; }\n.ms-tl-node.cr.below .ms-tl-label{ top:14px; }\n.ms-tl-l1{ font-size:13px; font-weight:600; color:var(--text); letter-spacing:-0.012em; }\n.ms-tl-l2{ font-size:11px; color:var(--text-dim); letter-spacing:-0.01em; }\n[data-theme=\"dark\"] .ms-tl-l1{ color:var(--on-dark); }\n.ms-tl-node.cr.reached .ms-tl-l2{ color:#34c759; }\n.ms-tl-node.cr.active .ms-tl-l1{ color:var(--primary-on-dark); }\n\n/* FIRE chips — always above, pill shape */\n.ms-tl-chip{\n  position:absolute; left:50%; transform:translateX(-50%);\n  bottom:18px;\n  padding:5px 10px 6px; border-radius:9999px;\n  display:flex; flex-direction:column; align-items:center; gap:0;\n  font-variant-numeric:tabular-nums; pointer-events:none;\n  border:1px solid rgba(255,255,255,0.10);\n}\n.ms-tl-node.fire-uk .ms-tl-chip{ background:rgba(94,142,219,0.18); }\n.ms-tl-node.fire-in .ms-tl-chip{ background:rgba(58,163,113,0.18); }\n.ms-tl-chip-l1{ font-size:11px; font-weight:600; color:var(--text); letter-spacing:-0.01em; }\n.ms-tl-chip-l2{ font-size:10px; color:var(--text-dim); }\n[data-theme=\"dark\"] .ms-tl-chip-l1{ color:var(--on-dark); }\n.ms-tl-node.fire.reached .ms-tl-chip-l2{ color:#34c759; }\n\n/* Connector line from label to dot */\n.ms-tl-node::before{\n  content:\"\"; position:absolute; left:50%; width:1px; background:var(--border);\n  transform:translateX(-50%); pointer-events:none;\n}\n.ms-tl-node.cr.above::before{ bottom:6px; height:10px; }\n.ms-tl-node.cr.below::before{ top:6px; height:10px; }\n.ms-tl-node.fire::before{ bottom:6px; height:14px; }\n[data-theme=\"dark\"] .ms-tl-node::before{ background:rgba(255,255,255,0.18); }\n\n/* \"You are here\" marker */\n.ms-tl-here{\n  position:absolute; top:50%; transform:translate(-50%,-50%);\n  display:flex; flex-direction:column; align-items:center; gap:0;\n  pointer-events:none;\n}\n.ms-tl-here-dot{\n  width:14px; height:14px; border-radius:50%;\n  background:var(--primary); border:2px solid var(--canvas);\n  box-shadow:0 0 0 4px rgba(212,76,43,0.25), 0 0 14px rgba(212,76,43,0.5);\n  animation:msHerePulse 2.4s ease-in-out infinite;\n}\n@keyframes msHerePulse{\n  0%,100%{ box-shadow:0 0 0 4px rgba(212,76,43,0.25), 0 0 14px rgba(212,76,43,0.5); }\n  50%{ box-shadow:0 0 0 7px rgba(212,76,43,0.10), 0 0 18px rgba(212,76,43,0.6); }\n}\n.ms-tl-here-label{\n  position:absolute; top:22px; font-size:11px; font-weight:600;\n  color:var(--primary-on-dark); letter-spacing:-0.01em;\n  white-space:nowrap;\n}\n\n/* Legend */\n.ms-tl-legend{\n  display:flex; gap:18px; justify-content:center; flex-wrap:wrap;\n  margin-top:12px; padding-top:8px;\n  font-size:11px; color:var(--text-dim); letter-spacing:-0.01em;\n}\n.ms-tl-legend span{ display:inline-flex; align-items:center; gap:6px; }\n.ms-tl-legend-dot{ width:8px; height:8px; border-radius:50%; background:var(--text); }\n[data-theme=\"dark\"] .ms-tl-legend-dot{ background:var(--on-dark); }\n.ms-tl-legend-dot.fire-uk{ background:#5e8edb; }\n.ms-tl-legend-dot.fire-in{ background:#3aa371; }\n.ms-tl-legend-dot.here{ background:var(--primary); }\n\n/* Detail panel (appears below timeline when a node is tapped) */\n.ms-tl-detail{\n  margin-top:16px; padding:16px 18px;\n  background:rgba(255,255,255,0.04);\n  border:1px solid var(--border);\n  border-radius:14px;\n  text-align:left;\n  animation:msDetailIn 0.22s cubic-bezier(0.32,0.72,0,1);\n}\n[data-theme=\"dark\"] .ms-tl-detail{ background:rgba(255,255,255,0.04); border-color:rgba(255,255,255,0.10); }\n@keyframes msDetailIn{ from{ opacity:0; transform:translateY(-4px); } to{ opacity:1; transform:none; } }\n.ms-tl-d-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:14px; }\n.ms-tl-d-kind{ font-size:11px; letter-spacing:0.05em; text-transform:uppercase; color:var(--text-dim); font-weight:500; }\n.ms-tl-d-title{ font-size:22px; font-weight:600; color:var(--text); letter-spacing:-0.018em; }\n[data-theme=\"dark\"] .ms-tl-d-title{ color:var(--on-dark); }\n.ms-tl-d-close{\n  background:transparent; border:1px solid var(--border); color:var(--text-dim);\n  width:30px; height:30px; border-radius:50%;\n  cursor:pointer; display:inline-flex; align-items:center; justify-content:center;\n  font-size:13px; line-height:1; transition:all 0.15s;\n}\n.ms-tl-d-close:hover{ color:var(--text); border-color:var(--text-dim); }\n[data-theme=\"dark\"] .ms-tl-d-close{ border-color:rgba(255,255,255,0.18); }\n.ms-tl-d-grid{\n  display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px 24px;\n}\n.ms-tl-d-l{ font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.05em; font-weight:500; margin-bottom:3px; }\n.ms-tl-d-v{ font-size:18px; font-weight:600; color:var(--text); letter-spacing:-0.014em; font-variant-numeric:tabular-nums; }\n[data-theme=\"dark\"] .ms-tl-d-v{ color:var(--on-dark); }\n.ms-tl-d-foot{ margin-top:12px; font-size:12px; color:var(--text-dim); line-height:1.5; }\n\n@media (max-width: 640px){\n  .milestone-tl{ height:130px; }\n  .ms-tl-node.cr.below .ms-tl-label{ top:auto; bottom:14px; }\n  .ms-tl-node.cr.below::before{ top:auto; bottom:6px; }\n  .ms-tl-l1{ font-size:11px; }\n  .ms-tl-l2{ font-size:10px; }\n  .ms-tl-chip{ padding:3px 7px 4px; }\n  .ms-tl-chip-l1{ font-size:10px; }\n  .ms-tl-chip-l2{ font-size:9px; }\n  .ms-tl-d-grid{ grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px 16px; }\n  .ms-tl-d-v{ font-size:15px; }\n  .ms-tl-d-title{ font-size:18px; }\n  .ms-tl-here-label{ font-size:10px; top:20px; }\n  .milestone-tl-wrap{ margin-top:24px; padding:0 4px; }\n  .ms-tl-legend{ gap:10px 12px; font-size:10px; }\n}\n<\u002Fstyle>\n\n<!-- Bundler thumbnail (shown briefly when opening the bundled offline file) -->\n\n<\u002Fhead>\n<body>\n\n<!-- ═══════════════ LOCK ═══════════════ -->\n<div id=\"lockscreen\">\n  <div class=\"lock-mark\"><\u002Fdiv>\n\n  <!-- Setup pane: shown on first run when no passphrase is configured -->\n  <div class=\"lock-pane\" id=\"setup-pane\" hidden=\"\">\n    <div class=\"lock-title\">Set passphrase<\u002Fdiv>\n    <div class=\"lock-sub\">\n      At least 12 characters. Mix letters, digits and symbols.<br>\n      Forget it and your data is gone — there's no reset.\n    <\u002Fdiv>\n    <form class=\"lock-form\" id=\"setup-form\" onsubmit=\"event.preventDefault();doSetup()\">\n      <!-- Username field: stable identifier for iCloud Keychain so it can save and autofill across devices -->\n      <input type=\"text\" id=\"setup-user\" class=\"pp-user-display\" autocomplete=\"username\" name=\"username\" value=\"portfolio\" readonly=\"\" tabindex=\"-1\">\n      <input type=\"password\" id=\"setup-pp1\" class=\"pp-input\" placeholder=\"Passphrase\" autocomplete=\"new-password\" autocapitalize=\"off\" autocorrect=\"off\" spellcheck=\"false\">\n      <div class=\"pp-strength-track\"><div class=\"pp-strength-fill\" id=\"pp-meter\"><\u002Fdiv><\u002Fdiv>\n      <div class=\"pp-strength-label\" id=\"pp-strength-label\">—<\u002Fdiv>\n      <input type=\"password\" id=\"setup-pp2\" class=\"pp-input\" placeholder=\"Confirm passphrase\" autocomplete=\"new-password\" autocapitalize=\"off\" autocorrect=\"off\" spellcheck=\"false\">\n      <button type=\"submit\" class=\"pp-submit\" id=\"setup-btn\">Create &amp; unlock<\u002Fbutton>\n    <\u002Fform>\n    <div class=\"lock-error\" id=\"setup-error\"><\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- Recovery-code reveal pane: shown ONCE, right after setup succeeds -->\n  <div class=\"lock-pane\" id=\"recovery-show-pane\" hidden=\"\">\n    <div class=\"lock-title\">Save your recovery code<\u002Fdiv>\n    <div class=\"lock-sub\">\n      If you ever forget your passphrase, this code is the only way back in.<br>\n      Save it in your password manager, on paper, or email it to yourself.\n    <\u002Fdiv>\n    <div class=\"recovery-code-box\" id=\"recovery-code-display\">—<\u002Fdiv>\n    <div class=\"lock-form\" style=\"margin-top:18px\">\n      <button type=\"button\" class=\"pp-submit ghost\" onclick=\"copyRecoveryCode()\">Copy code<\u002Fbutton>\n      <button type=\"button\" class=\"pp-submit ghost\" onclick=\"downloadRecoveryCode()\">Download as .txt<\u002Fbutton>\n      <button type=\"button\" class=\"pp-submit\" id=\"recovery-confirm-btn\" onclick=\"confirmRecoverySaved()\">I've saved it — continue<\u002Fbutton>\n    <\u002Fdiv>\n    <div class=\"lock-error\" id=\"recovery-show-error\"><\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- Unlock pane: shown on every subsequent open -->\n  <div class=\"lock-pane\" id=\"unlock-pane\" hidden=\"\">\n    <div class=\"lock-title\">Citruz Portfolio<\u002Fdiv>\n    <div class=\"lock-sub\">Enter your passphrase.<\u002Fdiv>\n    <form class=\"lock-form\" id=\"unlock-form\" onsubmit=\"event.preventDefault();doUnlock()\">\n      <input type=\"text\" id=\"unlock-user\" class=\"pp-user-display\" autocomplete=\"username\" name=\"username\" value=\"portfolio\" readonly=\"\" tabindex=\"-1\">\n      <input type=\"password\" id=\"unlock-pp\" class=\"pp-input\" placeholder=\"Passphrase\" autocomplete=\"current-password\" autocapitalize=\"off\" autocorrect=\"off\" spellcheck=\"false\">\n      <button type=\"submit\" class=\"pp-submit\" id=\"unlock-btn\">Unlock<\u002Fbutton>\n    <\u002Fform>\n    <div class=\"lock-error\" id=\"unlock-error\"><\u002Fdiv>\n    <button type=\"button\" class=\"pp-link\" onclick=\"showRecoveryUnlock()\">Forgot passphrase? Use recovery code<\u002Fbutton>\n    <button type=\"button\" class=\"pp-link pp-link-danger\" onclick=\"FinAuth.factoryReset()\">Reset app (deletes all data)<\u002Fbutton>\n  <\u002Fdiv>\n\n  <!-- Recovery unlock pane: user has the recovery code, no passphrase -->\n  <div class=\"lock-pane\" id=\"recovery-unlock-pane\" hidden=\"\">\n    <div class=\"lock-title\">Recovery code<\u002Fdiv>\n    <div class=\"lock-sub\">\n      Enter the 20-character code you saved at setup.<br>\n      Hyphens and case are ignored.\n    <\u002Fdiv>\n    <form class=\"lock-form\" onsubmit=\"event.preventDefault();doRecoveryUnlock()\">\n      <input type=\"text\" id=\"recovery-input\" class=\"pp-input mono\" placeholder=\"XXXX-XXXX-XXXX-XXXX-XXXX\" autocomplete=\"off\" autocapitalize=\"characters\" autocorrect=\"off\" spellcheck=\"false\">\n      <button type=\"submit\" class=\"pp-submit\" id=\"recovery-unlock-btn\">Recover &amp; set new passphrase<\u002Fbutton>\n    <\u002Fform>\n    <div class=\"lock-error\" id=\"recovery-unlock-error\"><\u002Fdiv>\n    <button type=\"button\" class=\"pp-link\" onclick=\"showUnlockPane()\">← Back to passphrase<\u002Fbutton>\n  <\u002Fdiv>\n\n  <!-- S
